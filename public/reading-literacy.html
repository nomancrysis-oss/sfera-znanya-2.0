d:#fafbf8;font-size:13px;color:var(--muted);margin-bottom:25px}.section-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:22px 0 18px}.section-head h2{margin:0}.filters{display:flex;gap:6px;flex-wrap:wrap}.filters button.active{background:var(--ink);color:white;border-color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card,.panel{background:white;border:1px solid var(--line);border-radius:19px;padding:25px}.card{display:flex;flex-direction:column}.card h3{font:26px/1.18 Georgia,serif;margin:15px 0}.card p{font-size:14px;color:var(--muted)}.card .bottom{margin-top:auto;padding-top:20px;display:flex;align-items:center;justify-content:space-between;gap:8px}.card .bottom small{color:var(--muted)}.card-icon{width:48px;height:48px;background:var(--light);border-radius:13px;display:grid;place-items:center;font:25px Georgia,serif}.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:25px}.skills div{padding:16px 0;border-top:1px solid var(--line)}.skills b{font-size:14px}.skills p{font-size:13px;color:var(--muted);margin:5px 0}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:19px}.work{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}.reading{position:sticky;top:18px;max-height:calc(100vh - 40px);overflow:auto}.reading h2{font:30px/1.2 Georgia,serif}.reading article{font:19px/1.8 Georgia,serif}.reading.large article{font-size:23px}.reading article p{margin-bottom:19px}.paragraph-number{color:#829082;font:11px system-ui;margin-right:7px;vertical-align:super}.source{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:20px}.progress{height:6px;background:#e8ebe4;border-radius:10px;overflow:hidden;margin:13px 0 23px}.progress div{height:100%;background:var(--green);transition:width .2s}.steps{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}.steps button{width:37px;height:37px;padding:0;border-radius:50%;font-size:13px}.steps button.done{background:var(--light)}.steps button.current{background:var(--green);color:white}.question{font-size:22px;line-height:1.4;margin:12px 0 20px}.option{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;margin:10px 0;cursor:pointer}.option:has(input:checked){background:var(--light);border-color:var(--green)}.option input{margin-top:6px;accent-color:var(--green);flex-shrink:0}.option span{font-size:15px}textarea,input[type=text],select{border:1px solid #cdd6cc;padding:12px;width:100%;background:white;color:var(--ink)}textarea{min-height:140px;resize:vertical}.field{display:block;margin:16px 0}.field>span{display:block;font-size:14px;font-weight:650;margin-bottom:7px}.hint{font-size:13px;color:var(--muted)}.actions{display:flex;gap:9px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:25px}.feedback{padding:15px;border-radius:12px;background:#eef5eb;font-size:14px;margin-top:13px}.feedback.wrong{background:#fff2e6}.error{color:#a63825;font-size:14px;min-height:22px;margin-top:12px}.result-top{background:var(--green);color:white;border-radius:20px;padding:28px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:23px}.result-top h2{margin-bottom:6px}.result-top p{margin:0;color:#daeade}.score{font:45px Georgia,serif;white-space:nowrap}.review{margin-bottom:16px}.review h3{font-size:17px}.review .answer{white-space:pre-wrap;padding:12px;background:var(--bg);border-radius:10px;overflow-wrap:anywhere}.rubric{font-size:14px;padding-left:20px}.two{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:start}.builder-q{border:1px solid var(--line);border-radius:14px;padding:16px;margin:15px 0;background:#fafbf8}.builder-q .field{margin:10px 0}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.history-row{display:flex;justify-content:space-between;gap:15px;padding:18px 0;border-bottom:1px solid var(--line)}.history-row b{display:block}.empty{padding:35px;text-align:center;background:white;border:1px dashed #cbd6c8;border-radius:18px;color:var(--muted)}details{margin:16px 0}summary{cursor:pointer;font-weight:600}footer{font-size:12px;color:var(--muted);margin-top:32px;border-top:1px solid var(--line);padding-top:17px}.hidden{display:none!important}.wide{grid-column:1/-1}.print-only{display:none}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 22px;border-radius:12px;z-index:10;max-width:90vw}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.work,.two{grid-template-columns:1fr}.reading{position:static;max-height:none}.hero{grid-template-columns:1.5fr 1fr;gap:18px}.top{align-items:flex-start}.brand small{display:none}}
@media(max-width:600px){.top{padding:15px 17px;display:block}nav{margin-top:14px}nav button{padding:8px 12px}.brand strong{font-size:19px}main{padding:20px 16px 40px}.hero{display:block;padding-top:8px}.hero-art{display:none}.grid,.skills{grid-template-columns:1fr}.skills{gap:0}.section-head{align-items:flex-start;flex-direction:column}.card,.panel{padding:20px}.reading article{font-size:18px}.result-top{align-items:flex-start;flex-direction:column}.toolbar button{font-size:13px}.question{font-size:20px}.row{flex-wrap:wrap}}

<script>
'use strict';
const baseLessons=[
{id:'library',title:'Библиотека после звонка',grade:'7',kind:'Художественный текст',icon:'Аа',time:'12–15 мин',
intro:'О маленьком решении, которое меняет отношение к общему делу.',
text:[
'В четверг Аян снова задержался у двери школьной библиотеки. На столе лежал лист: «Предложите, как сделать библиотеку удобнее». Под ним кто-то написал: «Поставьте новые кресла». Аян подумал о креслах, но вспомнил, что во вторник ему негде было закончить групповое задание: библиотека закрылась сразу после последнего урока.',
'Он написал: «Оставляйте библиотеку открытой на час дольше хотя бы два раза в неделю». На следующий день библиотекарь пригласила его поговорить. Аян ожидал услышать, что ничего не получится. Вместо этого она спросила: «А кто поможет мне расставить книги? Если успеем раньше, я смогу остаться».',
'В понедельник пришли трое. В среду — уже шестеро. Они возвращали книги на полки и делали закладки с рекомендациями. Сначала Аян выбирал для закладок только любимые рассказы. Потом заметил, что пятиклассники чаще спрашивают книги о животных, и начал советоваться с ними.',
'Через месяц у входа появился новый график: по вторникам и четвергам библиотека работала до пяти. Кресла остались прежними. Но теперь на них почти всегда кто-нибудь сидел.',
'Когда одноклассник сказал: «Повезло тебе с библиотекарем», Аян пожал плечами. Он вспомнил тот лист у двери: на нём ещё оставалось много свободного места.'
],qs:[
{skill:'Найти информацию',q:'Почему Аян предложил продлить работу библиотеки?',options:['Ему не нравились старые кресла.','Он не смог закончить там групповое задание после уроков.','Библиотекарь попросила написать это предложение.','Он хотел каждый день расставлять книги.'],correct:1,explain:'В первом абзаце указано: библиотека закрылась, и Аяну негде было закончить групповое задание.'},
{skill:'Сделать вывод',q:'Почему Аян стал советоваться с пятиклассниками?',options:['Он перестал любить рассказы.','Библиотекарь запретила ему выбирать книги.','Он понял, что рекомендации должны учитывать интересы читателей.','Он хотел передать им всю работу.'],correct:2,explain:'В третьем абзаце Аян замечает интерес пятиклассников к книгам о животных и меняет свой подход.'},
{skill:'Интерпретировать',q:'Какую мысль подчёркивает деталь о старых креслах?',options:['Перемены могут сделать место полезнее даже без новой мебели.','Библиотеке вообще не нужна мебель.','Предложение о креслах было выполнено.','Ученикам запретили сидеть на креслах.'],correct:0,explain:'Мебель не изменилась, но библиотека стала востребованнее благодаря новому графику и участию учеников.'},
{skill:'Оценить утверждение',q:'Как точнее оценить реплику «Повезло тебе с библиотекарем»?',options:['Она полностью объясняет все события рассказа.','Она доказывает, что ученики ничем не помогли.','Она означает, что библиотекарь отказалась от идеи.','Она учитывает поддержку взрослого, но упускает инициативу и труд учеников.'],correct:3,explain:'Библиотекарь поддержала предложение, а ученики помогли освободить её время. Результат возник из совместных действий.'},
{skill:'Обосновать текстом',q:'Что может означать свободное место на листе в финале? Сформулируйте вывод и подтвердите его одним событием рассказа.',type:'open',sample:'Свободное место напоминает, что у других учеников тоже есть возможность предложить изменения. Например, предложение Аяна привело к новому графику, потому что он и его товарищи включились в работу.',rubric:['1 балл — дан обоснованный вывод о возможности новых инициатив или участии в изменениях.','1 балл — приведено конкретное событие рассказа и объяснена его связь с выводом.']}
]},
{id:'water',title:'Одна цифра — два вывода',grade:'8',kind:'Информационный текст',icon:'≈',time:'12–15 мин',
intro:'Учимся читать данные и замечать границы доказательств.',
text:[
'Экоклуб одной школы решил проверить, помогает ли напоминание у крана экономить воду. В течение первой учебной недели участники каждый вечер записывали показания отдельного счётчика в столовой. За пять дней расход составил 1200 литров.',
'Перед второй неделей у раковин разместили таблички «Закрой кран, пока намыливаешь руки». За следующие пять дней счётчик показал расход 900 литров. В школьном чате появилась запись: «Наши таблички сократили расход воды на четверть!»',
'На встрече экоклуба Дана уточнила, сколько учеников питалось в столовой. Оказалось, в первую неделю столовая обслужила 600 ученических обедов, а во вторую — 450: две параллели выезжали на соревнования. В обе недели меню и порядок уборки были одинаковыми. Участники решили для первого сравнения разделить общий расход на число обедов.',
'Получилось по 2 литра на один обед в каждую неделю. Дана предложила повторить наблюдение при сопоставимом числе посетителей и отдельно учитывать воду для приготовления пищи и мытья рук.',
'Экоклуб изменил запись: «Во вторую неделю столовая израсходовала на 300 литров меньше. Пока нельзя уверенно сказать, какая часть изменения связана с табличками». Напоминания оставили на месте, но вывод об их эффективности отложили.'
],qs:[
{skill:'Найти информацию',q:'На сколько литров уменьшился общий расход воды?',options:['На 150 литров.','На 300 литров.','На 450 литров.','На 600 литров.'],correct:1,explain:'1200 − 900 = 300 литров. Это изменение общего расхода, а не доказанная экономия благодаря табличкам.'},
{skill:'Сопоставить данные',q:'Что показывает расчёт расхода на один обед?',options:['В первую неделю — 2 л, во вторую — 1,5 л.','В первую неделю — 3 л, во вторую — 2 л.','В обе недели — 2 л.','В обе недели — 4 л.'],correct:2,explain:'1200 ÷ 600 = 2; 900 ÷ 450 = 2. Это условный показатель для сравнения: не вся вода в столовой расходуется непосредственно на обеды.'},
{skill:'Оценить доказательства',q:'Что прежде всего мешает приписать снижение расхода действию табличек?',options:['Изменилось число обедов, поэтому недели несопоставимы по посещаемости.','Наблюдение проходило в школе.','Запись появилась в чате.','Таблички были размещены у раковин.'],correct:0,explain:'Одновременно с появлением табличек уменьшилась посещаемость. Данных недостаточно, чтобы отделить влияние этих факторов.'},
{skill:'Интерпретировать',q:'Какой вывод соответствует последнему абзацу?',options:['Таблички точно бесполезны.','Таблички доказанно экономят 25% воды.','Показания счётчика оказались неверными.','Общий расход снизился, но причина снижения пока не установлена.'],correct:3,explain:'Экоклуб сохранил подтверждённый факт снижения расхода и отказался от неподтверждённого причинного объяснения.'},
{skill:'Обосновать текстом',q:'Предложите одно улучшение исследования и объясните, как оно поможет точнее проверить действие табличек.',type:'open',sample:'Можно сравнить расход воды именно у раковин в несколько дней с одинаковым числом посетителей — до размещения табличек и после. Это уменьшит влияние посещаемости и расхода воды на приготовление пищи. Для более уверенного вывода наблюдение стоит повторить.',rubric:['1 балл — предложено конкретное улучшение: сопоставимая посещаемость, отдельный учёт воды у раковин или подходящее сравнение.','1 балл — объяснено, какой посторонний фактор или недостаток измерения оно помогает учесть.']}
]},
{id:'post',title:'Объявление без источника',grade:'9',kind:'Медиатекст и диалог',icon:'“ ”',time:'12–15 мин',
intro:'Проверяем сообщения и отличаем уверенный тон от надёжного основания.',
text:[
'В классном чате появилось пересланное сообщение: «С понедельника все школьные библиотеки города переходят на электронные книги. Бумажные издания больше выдавать не будут. Срочно перешлите родителям!» Под текстом стояла подпись «Отдел образования», но ссылки на документ и даты публикации не было.',
'— Там же написано, кто сообщил, — заметил Тимур. — Зачем ещё проверять?\n— Подпись можно дописать, — ответила Лера. — Давайте найдём исходное сообщение.',
'На официальной странице своей школы они обнаружили объявление, опубликованное в тот же день: «С понедельника в нашей библиотеке начнётся тестирование электронного каталога. Во время настройки выдача бумажных книг продолжится. Поиск по электронному каталогу временно доступен только с компьютера библиотекаря».',
'Тимур решил, что пересланное сообщение полностью выдумано. Лера возразила: «У него есть похожая деталь — изменение с понедельника. Но каталог не равен электронным книгам, а наша школа — не все школы города».',
'Ребята отправили в чат ссылку на школьное объявление и выписали два расхождения. Затем добавили: «По нашей школе информация уточнена. Утверждение обо всех библиотеках города этим объявлением не подтверждается; для его проверки нужен городской источник».'

if(!active){setPage('library');return}
const q=active.qs[qi],done=answers.filter(answered).length;
$('#app').innerHTML=`<div class="toolbar no-print"><button class="small" id="backLibrary">← К текстам</button><span class="hint">Сначала прочитайте текст. К нему можно возвращаться во время работы.</span></div><div class="work">${reader(active)}<section class="panel"><div class="eyebrow">Работа с текстом</div><div class="toolbar" style="margin:8px 0 0"><b>Задание ${qi+1} из ${active.qs.length}</b><span class="hint">Заполнено: ${done}</span></div><div class="progress"><div style="width:${done/active.qs.length*100}%"></div></div><div class="steps">${active.qs.map((_,i)=>`<button class="${answered(answers[i])?'done':''} ${i===qi?'current':''}" data-step="${i}" aria-label="Задание ${i+1}" ${i===qi?'aria-current="step"':''}>${i+1}</button>`).join('')}</div><span class="pill">${esc(q.skill)}</span><h2 class="question">${esc(q.q)}</h2>
${q.type==='open'?`<label for="written" class="hint">Ваш ответ. Используйте факты или детали текста.</label><textarea id="written" maxlength="6000" placeholder="Я считаю, что… Это подтверждается…">${esc(answers[qi])}</textarea><p class="hint">Письменный ответ оценивает учитель: до 2 баллов. Автоматической оценки смысла здесь нет.</p>`:q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${answers[qi]===i?'checked':''}><span>${esc(o)}</span></label>`).join('')}
<div class="actions"><button id="prev" ${qi===0?'disabled':''}>← Назад</button>${qi<active.qs.length-1?'<button class="primary" id="next">Далее →</button>':'<button class="primary" id="finish">Завершить</button>'}</div><div class="error" id="workError" role="status"></div></section></div>${footer()}`;
$('#backLibrary').onclick=()=>setPage('library');bindFont();
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{qi=Number(b.dataset.step);renderWork()});
if(q.type==='open')$('#written').oninput=e=>{answers[qi]=e.target.value;updateProgress()};
else document.querySelectorAll('[name=answer]').forEach(r=>r.onchange=()=>{answers[qi]=Number(r.value);updateProgress()});
$('#prev').onclick=()=>{qi--;renderWork()};
if($('#next'))$('#next').onclick=()=>{qi++;renderWork()};
if($('#finish'))$('#finish').onclick=finish;
}
function updateProgress(){
const done=answers.filter(answered).length;$('.progress div').style.width=done/active.qs.length*100+'%';
$('.toolbar .hint')?.textContent;
const p=document.querySelector('.panel .toolbar .hint');if(p)p.textContent='Заполнено: '+done;
document.querySelectorAll('[data-step]').forEach((b,i)=>b.classList.toggle('done',answered(answers[i])));
}
function bindFont(){if($('#fontSize'))$('#fontSize').onclick=()=>{large=!large;const r=$('.reading');r.classList.toggle('large',large);$('#fontSize').textContent='Аа '+(large?'Обычный':'Крупнее');$('#fontSize').setAttribute('aria-pressed',large)}}
function finish(){
const missing=answers.findIndex(a=>!answered(a));
if(missing!==-1){qi=missing;renderWork();$('#workError').textContent='Заполните ответ, чтобы завершить работу. Ваши остальные ответы сохранены в этой странице.';return}
submitted=true;
currentResult={id:Date.now(),lesson:active,answers:[...answers],marks:{},date:new Date().toLocaleString('ru-RU')};
history.unshift(currentResult);setPage('result');
}
function stats(r){
let auto=0,autoMax=0,manual=0,manualMax=0,pending=0;
r.lesson.qs.forEach((q,i)=>{if(q.type==='open'){manualMax+=2;if(r.marks[i]===undefined)pending++;else manual+=r.marks[i]}else{autoMax++;if(r.answers[i]===q.correct)auto++}});
return {auto,autoMax,manual,manualMax,pending,total:auto+manual,max:autoMax+manualMax};
}
function renderResult(){
if(!currentResult){setPage('history');return}
const r=currentResult,s=stats(r),l=r.lesson;
const skills={};l.qs.forEach((q,i)=>{if(q.type!=='open'){skills[q.skill]??={ok:0,n:0};skills[q.skill].n++;if(r.answers[i]===q.correct)skills[q.skill].ok++}});
$('#app').innerHTML=`<div class="toolbar no-print"><button id="resultBack" class="small">← Все результаты</button><button id="print" class="small">Печать / PDF</button></div><div class="result-top"><div><div style="font-size:12px;letter-spacing:1.5px;margin-bottom:9px">РАЗБОР РАБОТЫ</div><h2>${esc(l.title)}</h2><p>${s.pending?'Тестовая часть проверена. Письменные ответы ожидают оценки учителя.':'Все ответы проверены.'}</p></div><div class="score">${s.pending?s.auto+' / '+s.autoMax:s.total+' / '+s.max}<div style="font:12px system-ui;margin-top:8px">${s.pending?'баллов за тестовую часть':'баллов за всю работу'}</div></div></div>
<div class="notice">Это учебная обратная связь, без перевода в школьную отметку. ${s.manualMax?'Письменная часть: '+s.manual+' из '+s.manualMax+' баллов; не проверено ответов: '+s.pending+'.':''} Проверка учителем доступна ниже без пароля.</div>
<div class="work">${reader(l)}<div><section class="panel" style="margin-bottom:18px"><h3>Навыки в этой работе</h3>${Object.entries(skills).map(([k,v])=>`<div class="toolbar" style="margin:8px 0"><span>${esc(k)}</span><b>${v.ok}/${v.n}</b></div>`).join('')}<p class="hint" style="margin-top:14px">Это результат отдельных заданий, а не диагностика общего уровня. Вернитесь к объяснениям там, где ответ оказался неверным.</p></section>
${l.qs.map((q,i)=>{
if(q.type==='open')return `<section class="panel review"><span class="pill orange">Письменный ответ · до 2 баллов</span><h3>${i+1}. ${esc(q.q)}</h3><p class="hint">Ваш ответ</p><div class="answer">${esc(r.answers[i])}</div><details open><summary>Критерии и ориентир для проверки</summary><ul class="rubric">${q.rubric.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="hint">Возможный ответ — допустимы другие обоснованные формулировки:</p><p>${esc(q.sample)}</p></details><label class="field no-print"><span>Оценка учителя</span><select data-mark="${i}" aria-label="Оценка письменного ответа ${i+1}"><option value="">Ожидает проверки</option>${[0,1,2].map(n=>`<option value="${n}" ${r.marks[i]===n?'selected':''}>${n} из 2 баллов</option>`).join('')}</select></label><p class="print-only">Оценка учителя: ${r.marks[i]===undefined?'не выставлена':r.marks[i]+' / 2'}</p></section>`;
const ok=r.answers[i]===q.correct;
return `<section class="panel review"><span class="pill ${ok?'':'orange'}">${ok?'Верно · 1 балл':'Пока неверно · 0 баллов'}</span><h3>${i+1}. ${esc(q.q)}</h3><p><b>Ваш ответ:</b> ${esc(q.options[r.answers[i]])}</p>${!ok?`<p><b>Правильный ответ:</b> ${esc(q.options[q.correct])}</p>`:''}<div class="feedback ${ok?'':'wrong'}">${esc(q.explain)}</div></section>`;
}).join('')}<div class="actions no-print"><button id="again">Пройти заново</button><button class="primary" id="newText">Другой текст →</button></div></div></div>${footer()}`;
bindFont();$('#resultBack').onclick=()=>setPage('history');$('#print').onclick=()=>window.print();$('#again').onclick=()=>start(l.id);$('#newText').onclick=()=>setPage('library');
document.querySelectorAll('[data-mark]').forEach(e=>e.onchange=()=>{if(e.value==='')delete r.marks[e.dataset.mark];else r.marks[e.dataset.mark]=Number(e.value);renderResult()});
}
function renderHistory(){
$('#app').innerHTML=`<div class="eyebrow">Обратная связь</div><h1>Результаты работы</h1><p class="muted">Работы, выполненные в этой странице. После обновления страницы список очистится.</p>${history.length?`<section class="panel">${history.map(r=>{const s=stats(r);return `<div class="history-row"><div><b>${esc(r.lesson.title)}</b><span class="hint">${esc(r.date)} · ${s.pending?'ожидается проверка письменной части':'проверено полностью'}</span></div><div><span class="pill">${s.pending?s.auto+'/'+s.autoMax+' тест':s.total+'/'+s.max}</span><button class="small" data-result="${r.id}">Открыть</button></div></div>`}).join('')}</section>`:'<div class="empty"><h3>Пока нет завершённых работ</h3><p>Выберите текст и ответьте на вопросы — здесь появится результат.</p><button class="primary" id="toLibrary">Выбрать текст</button></div>'}${footer()}`;
document.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>{currentResult=history.find(r=>r.id===Number(b.dataset.result));setPage('result')});
if($('#toLibrary'))$('#toLibrary').onclick=()=>setPage('library');
}
function renderTeacher(){
$('#app').innerHTML=`<div class="eyebrow">Мастерская учителя</div><h1>Ваш текст. Ваши вопросы.</h1><p class="muted">Добавьте фрагмент произведения или информационный текст, затем составьте задания. Вопросы и критерии задаёт учитель.</p>
<div class="notice">Созданное задание появится в тренажёре этой страницы. Чтобы перенести его на другое устройство, скопируйте код задания внизу и вставьте там в поле импорта. Это ручной перенос, без синхронизации результатов.</div>
<div class="two"><form id="builder" class="panel"><h2>Новое задание</h2><label class="field"><span>Название</span><input type="text" id="title" maxlength="120" required placeholder="Например, Что хотел сказать автор?"></label><label class="field"><span>Класс</span><select id="grade"><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>7–9</option><option>10–11</option></select></label><label class="field"><span>Текст</span><textarea id="text" required maxlength="30000" style="min-height:240px" placeholder="Вставьте текст. Отделяйте абзацы пустой строкой."></textarea></label><p class="hint">Используйте собственные тексты или материалы, на использование которых у вас есть разрешение. Для учебного фрагмента укажите автора и произведение прямо в тексте.</p><h3 style="margin-top:26px">Вопросы</h3><div id="builderQuestions"></div><button type="button" class="small" id="addQ">+ Добавить вопрос</button><div class="error" id="builderError" role="status"></div><div class="actions"><button class="primary" type="submit">Добавить в тренажёр</button></div></form>
<aside><section class="panel"><h3>Хороший вопрос помогает рассуждать</h3><p><span class="pill">Найти</span><br>Какое условие названо во втором абзаце?</p><p><span class="pill">Связать</span><br>Как финальная деталь меняет понимание поступка героя?</p><p><span class="pill">Проверить</span><br>Достаточно ли приведённых данных для вывода? Почему?</p><p class="hint">Для письменного ответа задайте два проверяемых критерия по 1 баллу. Длина ответа сама по себе не показывает качество понимания.</p></section>
<section class="panel" style="margin-top:20px"><h3>Перенос задания</h3><label class="field"><span>Код для копирования или импорта</span><textarea id="transfer" spellcheck="false" placeholder="После создания здесь появится код. Или вставьте код задания с другого устройства."></textarea></label><div class="row"><button class="small" id="copy">Скопировать код</button><button class="small" id="import">Импортировать</button></div><p class="hint" id="transferStatus" role="status" style="margin-top:12px">Код содержит текст, вопросы и ключи ответов. Не используйте его для секретной контрольной работы.</p></section>
<section class="panel" style="margin-top:20px"><h3>Доступ с любых устройств</h3><p class="hint">Интерфейс уже подстраивается под экран телефона и компьютера. Для доступа по общей интернет-ссылке приложение нужно опубликовать на хостинге. Для общих результатов и кабинетов потребуется серверная база и вход пользователей.</p><p class="hint">В текущем прототипе нет регистрации, сервера и автоматического сохранения.</p></section></aside></div>${footer()}`;
renderDraftQs();
$('#addQ').onclick=()=>{saveDraftQs();if(draftQs.length>=12){toast('Не более 12 вопросов в одном задании');return}draftQs.push({type:'open',q:'',sample:'',options:['','','',''],correct:0});renderDraftQs()};
$('#builder').onsubmit=e=>{e.preventDefault();createLesson()};
$('#copy').onclick=async()=>{const el=$('#transfer');if(!el.value.trim()){toast('Сначала создайте задание');return}try{await navigator.clipboard.writeText(el.value);toast('Код скопирован')}catch{el.focus();el.select();toast('Код выделен. Скопируйте его через меню устройства.')}};
$('#import').onclick=importLesson;
}
function renderDraftQs(){
$('#builderQuestions').innerHTML=draftQs.map((q,i)=>`<div class="builder-q" data-draft="${i}"><div class="toolbar"><b>Вопрос ${i+1}</b>${draftQs.length>1?`<button type="button" class="small" data-remove="${i}">Удалить</button>`:''}</div><label class="field"><span>Тип ответа</span><select data-key="type" data-type="${i}"><option value="open" ${q.type==='open'?'selected':''}>Письменный · проверка учителем</option><option value="choice" ${q.type==='choice'?'selected':''}>Один из четырёх · автопроверка</option></select></label><label class="field"><span>Формулировка</span><textarea data-key="q" required maxlength="1500" style="min-height:80px">${esc(q.q)}</textarea></label>${q.type==='open'?`<label class="field"><span>Ориентир ответа</span><textarea data-key="sample" required maxlength="3000" style="min-height:80px">${esc(q.sample)}</textarea></label><label class="field"><span>Первый критерий · 1 балл</span><input type="text" data-key="c1" required maxlength="500" value="${esc(q.c1||'')}"></label><label class="field"><span>Второй критерий · 1 балл</span><input type="text" data-key="c2" required maxlength="500" value="${esc(q.c2||'')}"></label>`:`${q.options.map((o,j)=>`<label class="field"><span>Вариант ${j+1}</span><input type="text" data-option="${j}" required maxlength="700" value="${esc(o)}"></label>`).join('')}<label class="field"><span>Правильный вариант</span><select data-key="correct">${[0,1,2,3].map(n=>`<option value="${n}" ${q.correct===n?'selected':''}>Вариант ${n+1}</option>`).join('')}</select></label><label class="field"><span>Объяснение ответа</span><textarea data-key="sample" required maxlength="3000" style="min-height:80px">${esc(q.sample)}</textarea></label>`}</div>`).join('');
document.querySelectorAll('[data-type]').forEach(e=>e.onchange=()=>{saveDraftQs();renderDraftQs()});
document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{saveDraftQs();draftQs.splice(Number(b.dataset.remove),1);renderDraftQs()});
}
function saveDraftQs(){
document.querySelectorAll('[data-draft]').forEach(el=>{const d=draftQs[Number(el.dataset.draft)];el.querySelectorAll('[data-key]').forEach(e=>d[e.dataset.key]=e.dataset.key==='correct'?Number(e.value):e.value);el.querySelectorAll('[data-option]').forEach(e=>d.options[Number(e.dataset.option)]=e.value)});
}
function createLesson(){
saveDraftQs();
const title=$('#title').value.trim(),text=$('#text').value.trim();
if(!title||!text||draftQs.some(q=>!q.q.trim()||!q.sample.trim()||(q.type==='open'?(!q.c1?.trim()||!q.c2?.trim()):q.options.some(o=>!o.trim())))){
$('#builderError').textContent='Заполните название, текст, вопросы, варианты и критерии без пустых ответов.';return}
const lesson={id:'custom-'+Date.now(),title,grade:$('#grade').value,kind:'Материал учителя',icon:'Т',time:'Свой темп',intro:'Текст и задания подготовлены учителем.',custom:true,text:text.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean),qs:draftQs.map(q=>q.type==='open'?{type:'open',skill:'Письменное рассуждение',q:q.q.trim(),sample:q.sample.trim(),rubric:['1 балл — '+q.c1.trim(),'1 балл — '+q.c2.trim()]}:{skill:'Работа с текстом',q:q.q.trim(),options:q.options.map(x=>x.trim()),correct:q.correct,explain:q.sample.trim()})};
lessons.push(lesson);$('#transfer').value=JSON.stringify({format:'between-lines-1',lesson});$('#builderError').textContent='';$('#transferStatus').textContent='Задание добавлено. Скопируйте код, чтобы не потерять его после обновления страницы.';toast('Задание появилось в тренажёре');
}
function validateLesson(l){
const str=(v,max)=>typeof v==='string'&&v.trim().length>0&&v.length<=max;
if(!l||!str(l.title,120)||!['7','8','9','10','11','7–9','10–11'].includes(l.grade)||!Array.isArray(l.text)||!l.text.length||l.text.length>300||!l.text.every(p=>str(p,30000))||l.text.join('').length>30000||!Array.isArray(l.qs)||!l.qs.length||l.qs.length>12)return false;
return l.qs.every(q=>str(q.q,1500)&&(q.type==='open'?(str(q.sample,3000)&&Array.isArray(q.rubric)&&q.rubric.length===2&&q.rubric.every(r=>str(r,600))):(!q.type&&Array.isArray(q.options)&&q.options.length===4&&q.options.every(o=>str(o,700))&&Number.isInteger(q.correct)&&q.correct>=0&&q.correct<4&&str(q.explain,3000))));
}
function importLesson(){
try{
const raw=$('#transfer').value;if(raw.length>150000)throw Error();
const obj=JSON.parse(raw);if(obj.format!=='between-lines-1'||!validateLesson(obj.lesson))throw Error();
const a=obj.lesson,l={id:'import-'+Date.now(),title:a.title,grade:a.grade,kind:'Материал учителя',icon:'Т',time:'Свой темп',intro:'Задание перенесено учителем.',custom:true,text:a.text,qs:a.qs.map(q=>q.type==='open'?{type:'open',skill:'Письменное рассуждение',q:q.q,sample:q.sample,rubric:q.rubric}:{skill:'Работа с текстом',q:q.q,options:q.options,correct:q.correct,explain:q.explain})};
lessons.push(l);filter='all';setPage('library');toast('Задание импортировано');
}catch{$('#transferStatus').textContent='Не удалось прочитать задание. Вставьте полный код, созданный в мастерской этого приложения.'}
}
render();
</script>
