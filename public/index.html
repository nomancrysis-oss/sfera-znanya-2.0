const canonical=x=>JSON.stringify(x,(_k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.keys(v).filter(k=>!k.startsWith('_')).sort().map(k=>[k,v[k]])):v);
async function prepareImport(backup,includeProjects){
  const items=[],lessonMap=new Map();
  for(const kind of ['lessons','qrLinks',...(includeProjects?['projects']:[])]){
    for(const original of backup[kind]){
      let data=clone(original);
      if(kind==='projects'&&data.lessonId)data.lessonId=lessonMap.get(data.lessonId)||data.lessonId;
      const same=state[kind].find(r=>r.id===data.id);
      if(same&&canonical(same)!==canonical(data)){
        const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(kind+canonical(data)));
        data.id='import-'+Array.from(new Uint8Array(bytes)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,40);
      }
      if(kind==='lessons')lessonMap.set(original.id,data.id);
      if(!state[kind].some(r=>r.id===data.id))items.push({kind,data});
    }
  }
  return {items,favorites:backup.favorites.map(id=>lessonMap.get(id)||id)};
}

function resourcesMarkup(l){
 if(!l.resources?.length)return '';
 return `<section class="detail-section"><h3>${t('Документы и вложения','Құжаттар мен қосымшалар')} · ${l.resources.length}</h3><ul class="resource-list">${l.resources.map(r=>`<li><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a><small>${esc(resourceType(r.mime))}</small></li>`).join('')}</ul></section>`;
}

let qrCatalogFilter={q:"",subject:"",grade:""};
function qrView(){
 const all=[...state.qrLinks.map(q=>({...q,category:q.category||t('Без предмета','Пән көрсетілмеген'),grade:String(q.grade||'—'),origin:'cloud'})),...DRIVE_QR_ITEMS.filter(q=>!state.qrLinks.some(saved=>saved.url===q.url)).map(q=>({...q,origin:'drive'}))];
 const categories=[...new Set(all.map(q=>q.category))].sort((a,b)=>a.localeCompare(b));
 const grades=[...new Set(all.map(q=>String(q.grade||'—')))].sort((a,b)=>Number(a)-Number(b));
 const filtered=all.filter(q=>(!qrCatalogFilter.subject||q.category===qrCatalogFilter.subject)&&(!qrCatalogFilter.grade||String(q.grade||'—')===qrCatalogFilter.grade)&&(!qrCatalogFilter.q||(q.title+' '+q.category+' '+q.grade).toLocaleLowerCase().includes(qrCatalogFilter.q.toLocaleLowerCase())));
 const options=(arr,current)=>arr.map(v=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(v==='—'?t('Класс не указан','Сынып көрсетілмеген'):v)}</option>`).join('');
 return `${head(t('Банк QR-кодов','QR-кодтар банкі'),t('Единый каталог материалов Google Диска и QR-кодов, созданных учителями.','Google Drive материалдары мен мұғалімдер жасаған QR-кодтардың бірыңғай каталогы.'))}
 <div class="two-col"><section class="panel"><h2>${t('Новый QR-код','Жаңа QR-код')}</h2>
 <form id="qr-form" class="form-grid"><label class="field full">${t('Название материала','Материал атауы')}<input name="title" id="qr-title" maxlength="200" required placeholder="${t('Название материала','Материал атауы')}"></label>
 <label class="field">${t('Предмет / направление','Пән / бағыт')}<select name="category" id="qr-category"><option value="">${t('Выберите предмет','Пәнді таңдаңыз')}</option>${options(categories, '')}</select></label>
 <label class="field">${t('Класс','Сынып')}<select name="grade" id="qr-grade"><option value="—">${t('Не указан','Көрсетілмеген')}</option>${Array.from({length:11},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('')}</select></label>
 <label class="field full">${t('Ссылка *','Сілтеме *')}<input name="url" id="qr-url" type="url" required maxlength="1500" placeholder="https://…" value="${esc(qrValue)}"></label>
 <button class="btn primary full">${icon('qr')}${t('Создать и сохранить QR-код','QR-код жасау және сақтау')}</button></form>
 <p class="small muted">${t('После создания QR-код автоматически сохраняется в общий банк при наличии прав учителя. Без входа доступен просмотр и создание QR без сохранения.','Мұғалім құқығы болса, QR-код автоматты түрде ортақ банкке сақталады. Кірусіз QR-кодты сақтамай жасауға болады.')}</p>
 <div class="qr-preview" id="qr-preview">${qrSVG||`<span class="muted small">${t('Здесь появится ваш QR-код','QR-кодыңыз осы жерде пайда болады')}</span>`}</div>
 <div class="actions" id="qr-actions" ${qrSVG?'':'hidden'}>${btn(icon('download')+'SVG','download-qr')}${btn(icon('copy')+t('Копировать ссылку','Сілтемені көшіру'),'copy-qr')}</div></section>
 <section class="panel"><h2>${t('Доступность для учеников','Оқушыларға қолжетімділік')}</h2><ol class="help-list"><li>${t('Проверьте ссылку','Сілтемені тексеріңіз')}<small>${t('Материал должен открываться без учётной записи учителя.','Материал мұғалімнің тіркелгісінсіз ашылуы керек.')}</small></li><li>${t('Откройте QR на телефоне','Телефонмен QR-кодты ашыңыз')}<small>${t('Убедитесь, что ссылка ведёт к нужному материалу.','Сілтеменің қажетті материалға апаратынын тексеріңіз.')}</small></li></ol></section></div>
 <div class="section-head"><h2>${t('Единый каталог QR-кодов','Бірыңғай QR-кодтар каталогы')}</h2><span class="small muted">${filtered.length} / ${all.length}</span></div>
 <div class="panel form-grid" style="margin-bottom:18px"><label class="field full">${t('Поиск по названию','Атауы бойынша іздеу')}<input id="qr-filter-search" value="${esc(qrCatalogFilter.q)}" placeholder="${t('Введите название материала','Материал атауын енгізіңіз')}"></label>
 <label class="field">${t('Предмет','Пән')}<select id="qr-filter-subject"><option value="">${t('Все предметы','Барлық пәндер')}</option>${options(categories,qrCatalogFilter.subject)}</select></label>
 <label class="field">${t('Класс','Сынып')}<select id="qr-filter-grade"><option value="">${t('Все классы','Барлық сыныптар')}</option>${options(grades,qrCatalogFilter.grade)}</select></label></div>
 <div class="grid">${filtered.map(q=>`<article class="card"><div class="tool-icon lilac">${icon('qr')}</div><h3 style="margin-top:14px">${esc(q.title)}</h3><p>${esc(q.category)} · ${esc(String(q.grade||'—'))} ${q.grade==='—'?'':t('класс','сынып')}</p><div class="tags"><span class="tag">${q.origin==='cloud'?t('Добавлено учителем','Мұғалім қосты'):t('Google Диск','Google Drive')}</span></div><div class="actions">${btn(t('Показать QR','QR көрсету'),'catalog-show-qr',`data-url="${esc(q.url)}" data-title="${esc(q.title)}"`,'small')}<a class="btn small" href="${esc(q.url)}" target="_blank" rel="noopener noreferrer">${t('Открыть','Ашу')}</a>${q.origin==='cloud'?btn(t('Удалить','Жою'),'delete-qr',`data-id="${esc(q.id)}"`,'small danger'):''}</div></article>`).join('')||empty(t('Ничего не найдено','Ештеңе табылмады'),t('Измените поисковый запрос или фильтры.','Іздеу сұрауын немесе сүзгілерді өзгертіңіз.'))}</div>`;

function makeQR(value){const url=safeURL(value).replace(/[^\x00-\x7F]/g,c=>encodeURIComponent(c));if(!url||url.length>1500)throw Error(t('Используйте ссылку длиной до 1500 символов.','1500 таңбадан аспайтын сілтемені қолданыңыз.'));const qr=new window.SferaQR(-1,0);qr.addData(url);qr.make();const n=qr.getModuleCount(),size=n+8;let path='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))path+=`M${c+4} ${r+4}h1v1h-1z`;qrSVG=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" role="img" aria-label="QR code" shape-rendering="crispEdges"><rect width="${size}" height="${size}" fill="white"/><path d="${path}" fill="black"/></svg>`;qrValue=url;return qrSVG;}
const EXERCISES=[{id:'energy',title:['Энергия школьного кабинета','Мектеп кабинетіндегі энергия'],area:['Математическая грамотность · 7–9 классы','Математикалық сауаттылық · 7–9 сынып'],body:['В кабинете 5 ламп по 60 Вт. Они работают 4 часа в день, 30 дней. Их заменили на 5 LED-ламп по 9 Вт с тем же временем работы. Сколько киловатт-часов экономится за эти 30 дней?','Кабинетте 60 Вт-тан 5 шам бар. Олар күніне 4 сағаттан 30 күн жанады. Оларды 9 Вт-тан 5 LED-шамға ауыстырды. Жұмыс уақыты өзгермеді. Осы 30 күнде неше киловатт-сағат үнемделеді?'],unit:'кВт·ч / кВт·сағ',answer:30.6,solution:['Мощность до замены: 5 × 60 = 300 Вт = 0,3 кВт. После: 5 × 9 = 45 Вт = 0,045 кВт. За 120 часов экономия: (0,3 − 0,045) × 120 = 30,6 кВт·ч.','Бастапқы қуат: 5 × 60 = 300 Вт = 0,3 кВт. Кейін: 5 × 9 = 45 Вт = 0,045 кВт. 120 сағаттағы үнем: (0,3 − 0,045) × 120 = 30,6 кВт·сағ.']},{id:'water',title:['Сколько воды можно сохранить?','Қанша су үнемдеуге болады?'],area:['Естественно-научный контекст · 6–8 классы','Жаратылыстану мәнмәтіні · 6–8 сынып'],body:['Обычный кран расходует 9 литров в минуту, кран с аэратором — 6 литров. В обоих случаях воду включают на 10 минут в день. Сколько литров сэкономит аэратор за 7 дней?','Кәдімгі кран минутына 9 литр, аэраторы бар кран 6 литр су жұмсайды. Екі жағдайда да су күніне 10 минут ағады. Аэратор 7 күнде неше литр су үнемдейді?'],unit:['литров','литр'],answer:210,solution:['Разница расходов: 9 − 6 = 3 л/мин. В день: 3 × 10 = 30 л. За неделю: 30 × 7 = 210 л.','Шығын айырмасы: 9 − 6 = 3 л/мин. Күніне: 3 × 10 = 30 л. Аптасына: 30 × 7 = 210 л.']},{id:'map',title:['Школьный двор на плане','Жоспардағы мектеп ауласы'],area:['Геометрия в жизни · 6–8 классы','Өмірдегі геометрия · 6–8 сынып'],body:['На плане масштаба 1:500 прямоугольная площадка имеет длину 6 см и ширину 4 см. Найдите её реальную площадь в квадратных метрах.','Масштабы 1:500 жоспардағы тік төртбұрышты алаңның ұзындығы 6 см, ені 4 см. Нақты ауданын шаршы метрмен табыңыз.'],unit:'м²',answer:600,solution:['1 см на плане соответствует 5 м. Длина: 6 × 5 = 30 м, ширина: 4 × 5 = 20 м. Площадь: 30 × 20 = 600 м².','Жоспардағы 1 см — 5 м. Ұзындығы: 6 × 5 = 30 м, ені: 4 × 5 = 20 м. Ауданы: 30 × 20 = 600 м².']}];

function csv(rows){return '\uFEFF'+rows.map(row=>row.map(value=>{let s=String(value??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}).join(';')).join('\r\n');}

 else if(f.classList.contains('exercise-form')){const ex=EXERCISES.find(x=>x.id===f.dataset.id);const s=d.answer.trim().replace(',','.');if(!/^-?\d+(\.\d+)?$/.test(s))throw Error(t('Введите число; дробную часть можно отделить запятой.','Сан енгізіңіз; бөлшек бөлігін үтірмен бөлуге болады.'));const ok=Math.abs(Number(s)-ex.answer)<1e-8;$('#feedback-'+ex.id).className='feedback'+(ok?'':' error');$('#feedback-'+ex.id).textContent=(ok?t('Верно! ','Дұрыс! '):t('Пока не совпало. ','Әзірге сәйкес емес. '))+tr(ex.solution);}

 else if(f.id==='prompt-form'){const kinds=['план интегрированного урока','контекстные задания','рабочий лист','идеи межпредметного проекта'];promptValue=`Ты помогаешь учителю школы Казахстана. Подготовь ${kinds[Number(d.kind)]}.\nЯзык результата: ${d.language}.\nТема: ${d.topic.trim()}.\nПредметы: ${d.subjects.trim()}.\nКласс: ${d.grade}. Продолжительность: ${d.minutes} минут.\n\nТочные цели обучения, предоставленные учителем:\n${d.goals.trim()}\n\nРесурсы и условия:\n${d.context.trim()||'Не указаны: предложи доступный вариант и обозначь допущения.'}\n\nТребования:\n1. Сохрани коды и формулировки целей; не придумывай официальные цели и нормативные требования. Если цели не подходят теме или классу, сначала укажи несоответствие.\n2. Покажи содержательную связь предметов, объяснение, действия учителя и учащихся, время этапов, ресурсы и критерии успеха.\n3. Дай задания с решениями и понятными критериями оценивания, поддержку для испытывающих трудности и усложнение.\n4. Предложи жизненный контекст и уместную связь с профессиями. Авторские задания не называй официальными заданиями PISA/TIMSS.\n5. Не запрашивай персональные данные учеников. Не утверждай, что материал проверен или официально утверждён.\n6. В конце перечисли, что учителю нужно проверить перед уроком. Если для полноценного материала не хватает данных, задай конкретные вопросы.`;$('#prompt-output').value=promptValue;notify(t('Запрос готов: скопируйте его в ИИ-чат.','Сұрау дайын: ЖИ чатына көшіріңіз.'));}
