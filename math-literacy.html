<style>
:root{--ink:#182e38;--green:#166759;--mint:#e5f4ed;--line:#dbe5e4;--muted:#60747a}*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:var(--ink);font:16px/1.6 system-ui,sans-serif}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button{border:1px solid var(--line);border-radius:12px;padding:10px 16px;background:white;color:var(--ink);font-weight:650}button:hover{border-color:var(--green)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #d99a36;outline-offset:3px}button:disabled{opacity:.45;cursor:default}.primary,.active{background:var(--green)!important;color:white!important;border-color:var(--green)!important}.danger{color:#9d302c}header{background:white;border-bottom:1px solid var(--line)}.header{max-width:1260px;margin:auto;padding:18px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}.brand{font-size:27px;font-weight:850;letter-spacing:-1px;display:flex;gap:10px;align-items:center}.logo{background:var(--green);color:white;border-radius:14px;width:42px;height:42px;display:grid;place-items:center}.sub{font-size:12px;letter-spacing:.05em;color:var(--muted);font-weight:600}.spacer{flex:1}.langs{display:flex;gap:4px}main{max-width:1260px;margin:auto;padding:32px 24px}h1{font-size:clamp(28px,4vw,42px);line-height:1.18;letter-spacing:-1.3px;margin:8px 0 15px}h2{font-size:24px;line-height:1.35;margin:8px 0 18px}p{margin:10px 0}.muted{color:var(--muted)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--green);text-transform:uppercase}.hero{display:flex;justify-content:space-between;gap:24px;align-items:center;margin-bottom:28px}.pill{display:inline-block;border-radius:20px;padding:5px 12px;background:var(--mint);color:var(--green);font-size:13px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.card,.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:24px}.variant{text-align:left;min-height:165px;display:flex;flex-direction:column;justify-content:space-between}.variant strong{font-size:22px}.variant small{font-weight:400}.workspace{display:grid;grid-template-columns:255px 1fr;gap:22px}.numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:18px 0}.numbers button{padding:8px 0}.answered{background:var(--mint);border-color:#a1cbb9}.wrong{background:#fbe9e6!important;color:#9d302c!important}.correct{background:#e1f2e5!important;color:#216537!important}.question{white-space:pre-wrap;font-size:19px;line-height:1.8;margin:22px 0}.options{display:grid;gap:10px}.option{display:flex;text-align:left;gap:16px;align-items:center;min-height:60px;font-weight:450}.letter{width:32px;height:32px;flex-shrink:0;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;font-weight:750}.selected{border:2px solid var(--green);background:#edf7f2}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.actions{margin-top:26px}.notice{background:#fff5df;border:1px solid #ebd4a8;padding:15px;border-radius:12px;margin:15px 0}.solution{background:var(--mint);padding:20px;border-radius:14px;margin-top:20px;white-space:pre-wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.stat{padding:20px;background:var(--mint);border-radius:14px}.stat strong{display:block;font-size:28px}.field{display:block;margin:15px 0;font-weight:650}textarea,input,select{width:100%;padding:11px;border:1px solid #bccdca;border-radius:10px;background:white;color:var(--ink)}textarea{min-height:100px;resize:vertical}.editorcols{display:grid;grid-template-columns:1fr 1fr;gap:24px}.inline{width:auto}.history{margin-top:30px}footer{margin-top:36px;font-size:13px;color:var(--muted)}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#182e38;color:white;padding:12px 22px;border-radius:12px;z-index:20;max-width:90%}dialog{border:1px solid var(--line);border-radius:20px;padding:26px;max-width:480px;width:90%}dialog::backdrop{background:#142d3866}@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}.workspace{grid-template-columns:1fr}.sidebar .numbers{max-width:440px}.hero{align-items:flex-start}.editorcols{grid-template-columns:1fr}}@media(max-width:540px){main{padding:22px 14px}.header{padding:14px}.sub{display:none}.header>.spacer{display:none}.langs{margin-left:auto}.hero{display:block}.hero>.pill{margin-top:10px}.card,.panel{padding:18px}.stats{gap:6px}.stat{padding:12px}.stat strong{font-size:22px}.grid{gap:10px}.variant{padding:17px}.question{font-size:17px}.header button{padding:8px 11px}}@media print{header,.sidebar,.actions,footer,button{display:none!important}.workspace{display:block}body{background:white}.panel{border:0}}

<script>
'use strict';
// DATABASE: exactly 10 variants × 10 slots. ready=false marks a teacher template.
const DEFAULT_BANK = [{"id": 1, "questions": [{"id": "v1q1", "ready": true, "ru": {"title": "Покупки", "text": "Рюкзак стоит 12 000 ₸. На него действует скидка 15%. Сколько стоит рюкзак со скидкой?", "options": ["9 800 ₸", "10 000 ₸", "10 200 ₸", "10 800 ₸", "11 850 ₸"], "solution": "Скидка: 12 000 × 0,15 = 1 800 ₸. Цена: 12 000 − 1 800 = 10 200 ₸."}, "kz": {"title": "Сатып алу", "text": "Рюкзак 12 000 ₸ тұрады. Оған 15% жеңілдік берілді. Жеңілдіктен кейінгі бағасы қанша?", "options": ["9 800 ₸", "10 000 ₸", "10 200 ₸", "10 800 ₸", "11 850 ₸"], "solution": "Жеңілдік: 12 000 × 0,15 = 1 800 ₸. Бағасы: 12 000 − 1 800 = 10 200 ₸."}, "correct": 2}, {"id": "v1q2", "ready": true, "ru": {"title": "Маршрут", "text": "Автобус выехал в 08:35. Поездка заняла 1 ч 45 мин, включая остановки. Во сколько он прибыл?", "options": ["09:20", "10:10", "10:20", "10:30", "11:20"], "solution": "08:35 + 1 час = 09:35; ещё 45 минут — 10:20."}, "kz": {"title": "Бағыт", "text": "Автобус 08:35-те шықты. Аялдамаларды қоса есептегенде, жолға 1 сағ 45 мин кетті. Ол нешеде келді?", "options": ["09:20", "10:10", "10:20", "10:30", "11:20"], "solution": "08:35 + 1 сағат = 09:35; тағы 45 минут — 10:20."}, "correct": 2}, {"id": "v1q3", "ready": true, "ru": {"title": "Рецепт", "text": "Для 4 порций баурсаков нужно 600 г муки. Сколько муки нужно для 10 таких же порций?", "options": ["1 000 г", "1 200 г", "1 400 г", "1 500 г", "1 800 г"], "solution": "На порцию: 600 ÷ 4 = 150 г. На 10 порций: 150 × 10 = 1 500 г."}, "kz": {"title": "Рецепт", "text": "Бауырсақтың 4 үлесіне 600 г ұн керек. Осындай 10 үлеске қанша ұн керек?", "options": ["1 000 г", "1 200 г", "1 400 г", "1 500 г", "1 800 г"], "solution": "Бір үлеске: 600 ÷ 4 = 150 г. 10 үлеске: 150 × 10 = 1 500 г."}, "correct": 3}, {"id": "v1q4", "ready": true, "ru": {"title": "Школьный двор", "text": "Прямоугольная клумба имеет длину 8 м и ширину 5 м. Какова её площадь?", "options": ["13 м²", "26 м²", "35 м²", "40 м²", "80 м²"], "solution": "Площадь прямоугольника S = 8 × 5 = 40 м²."}, "kz": {"title": "Мектеп ауласы", "text": "Тіктөртбұрышты гүлзардың ұзындығы 8 м, ені 5 м. Оның ауданы қандай?", "options": ["13 м²", "26 м²", "35 м²", "40 м²", "80 м²"], "solution": "Тіктөртбұрыштың ауданы S = 8 × 5 = 40 м²."}, "correct": 3}, {"id": "v1q5", "ready": true, "ru": {"title": "Библиотека", "text": "Выдано книг за неделю:\nПн — 24; Вт — 30; Ср — 18; Чт — 28; Пт — 40.\nСколько книг в среднем выдавали за день?", "options": ["24", "26", "28", "30", "32"], "solution": "Всего 24 + 30 + 18 + 28 + 40 = 140. Среднее: 140 ÷ 5 = 28."}, "kz": {"title": "Кітапхана", "text": "Бір аптада берілген кітаптар:\nДс — 24; Сс — 30; Ср — 18; Бс — 28; Жм — 40.\nКүніне орта есеппен қанша кітап берілді?", "options": ["24", "26", "28", "30", "32"], "solution": "Барлығы: 24 + 30 + 18 + 28 + 40 = 140. Орташа мәні: 140 ÷ 5 = 28."}, "correct": 2}, {"id": "v1q6", "ready": true, "ru": {"title": "Школьная форма", "text": "У ученика 3 разные рубашки и 2 пары брюк. Сколько комплектов из одной рубашки и одной пары брюк можно составить?", "options": ["5", "6", "8", "9", "12"], "solution": "Для каждой из 3 рубашек есть 2 варианта брюк: 3 × 2 = 6."}, "kz": {"title": "Мектеп формасы", "text": "Оқушыда 3 түрлі жейде және 2 шалбар бар. Бір жейде мен бір шалбардан неше түрлі жиынтық құрастыруға болады?", "options": ["5", "6", "8", "9", "12"], "solution": "3 жейденің әрқайсысына 2 шалбар сәйкес келеді: 3 × 2 = 6."}, "correct": 1}, {"id": "v1q7", "ready": true, "ru": {"title": "Вода", "text": "Счётчик воды показывал 126 м³, а через месяц — 134 м³. Тариф 120 ₸ за 1 м³, без других платежей. Какова стоимость расхода?", "options": ["840 ₸", "900 ₸", "960 ₸", "1 080 ₸", "1 200 ₸"], "solution": "Расход: 134 − 126 = 8 м³. Стоимость: 8 × 120 = 960 ₸."}, "kz": {"title": "Су", "text": "Су есептегіші 126 м³, бір айдан кейін 134 м³ көрсетті. Тариф — 1 м³ үшін 120 ₸, басқа төлемдер жоқ. Тұтынылған судың құны қанша?", "options": ["840 ₸", "900 ₸", "960 ₸", "1 080 ₸", "1 200 ₸"], "solution": "Шығын: 134 − 126 = 8 м³. Құны: 8 × 120 = 960 ₸."}, "correct": 2}, {"id": "v1q8", "ready": true, "ru": {"title": "Масштаб", "text": "На карте масштаба 1 : 200 000 расстояние между сёлами равно 3,5 см. Каково расстояние на местности?", "options": ["0,7 км", "3,5 км", "7 км", "14 км", "70 км"], "solution": "1 см соответствует 200 000 см = 2 км. Значит, 3,5 × 2 = 7 км."}, "kz": {"title": "Масштаб", "text": "Масштабы 1 : 200 000 картада екі ауылдың арасы 3,5 см. Жер бетіндегі қашықтық қанша?", "options": ["0,7 км", "3,5 км", "7 км", "14 км", "70 км"], "solution": "1 см-ге 200 000 см = 2 км сәйкес келеді. Демек, 3,5 × 2 = 7 км."}, "correct": 2}, {"id": "v1q9", "ready": true, "ru": {"title": "Вероятность", "text": "В мешке 4 красных, 3 синих и 3 зелёных шара. Один шар достают случайно; все шары равновероятны. Какова вероятность синего шара?", "options": ["1/10", "3/10", "2/5", "1/2", "3/7"], "solution": "Всего 10 шаров, из них 3 синих: P = 3/10."}, "kz": {"title": "Ықтималдық", "text": "Қапта 4 қызыл, 3 көк және 3 жасыл шар бар. Бір шар кездейсоқ алынады; барлық шардың алыну мүмкіндігі бірдей. Көк шардың ықтималдығы қандай?", "options": ["1/10", "3/10", "2/5", "1/2", "3/7"], "solution": "Барлығы 10 шар, оның 3-еуі көк: P = 3/10."}, "correct": 1}, {"id": "v1q10", "ready": true, "ru": {"title": "Логика", "text": "Айдана, Болат и Дана заняли первые три места без ничьих. Айдана не первая и не третья. Болат выше Даны. Кто занял первое место?", "options": ["Айдана", "Болат", "Дана", "Нельзя определить", "Все трое"], "solution": "Айдана вторая. Остаются первое и третье места; Болат выше Даны, значит, он первый."}, "kz": {"title": "Логика", "text": "Айдана, Болат және Дана алғашқы үш орынды тең түспей иеленді. Айдана бірінші де, үшінші де емес. Болат Данадан жоғары орын алды. Бірінші орынды кім алды?", "options": ["Айдана", "Болат", "Дана", "Анықтау мүмкін емес", "Үшеуі де"], "solution": "Айдана екінші. Бірінші және үшінші орындар қалды; Болат Данадан жоғары, сондықтан ол бірінші."}, "correct": 1}]}, {"id": 2, "questions": [{"id": "v2q1", "ready": true, "ru": {"title": "Тарифы", "text": "План A: 2 000 ₸ в месяц и 20 ₸ за минуту. План B: 3 500 ₸ в месяц, 100 минут включены. Сколько сэкономит план B при 100 минутах разговоров?", "options": ["0 ₸", "200 ₸", "500 ₸", "1 000 ₸", "1 500 ₸"], "solution": "A: 2 000 + 20 × 100 = 4 000 ₸. B: 3 500 ₸. Экономия: 500 ₸."}, "kz": {"title": "Тарифтер", "text": "A тарифі: айына 2 000 ₸ және әр минутқа 20 ₸. B тарифі: айына 3 500 ₸, 100 минут кіреді. 100 минут сөйлескенде B тарифі қанша үнемдейді?", "options": ["0 ₸", "200 ₸", "500 ₸", "1 000 ₸", "1 500 ₸"], "solution": "A: 2 000 + 20 × 100 = 4 000 ₸. B: 3 500 ₸. Үнем: 500 ₸."}, "correct": 2}, {"id": "v2q2", "ready": true, "ru": {"title": "Две скидки", "text": "Куртка стоила 20 000 ₸. Цену сначала снизили на 10%, затем новую цену — ещё на 20%. Какова итоговая цена?", "options": ["14 000 ₸", "14 400 ₸", "15 000 ₸", "16 000 ₸", "18 000 ₸"], "solution": "20 000 × 0,9 = 18 000; затем 18 000 × 0,8 = 14 400 ₸. Проценты применяются последовательно."}, "kz": {"title": "Екі жеңілдік", "text": "Күртеше 20 000 ₸ тұрды. Алдымен бағасын 10%-ға, кейін жаңа бағасын тағы 20%-ға төмендетті. Соңғы бағасы қанша?", "options": ["14 000 ₸", "14 400 ₸", "15 000 ₸", "16 000 ₸", "18 000 ₸"], "solution": "20 000 × 0,9 = 18 000; кейін 18 000 × 0,8 = 14 400 ₸. Жеңілдіктер ретімен есептеледі."}, "correct": 1}, {"id": "v2q3", "ready": true, "ru": {"title": "Поездка", "text": "Автомобиль проехал 180 км за 3 часа, затем 120 км за 2 часа. Остановок не было. Найдите среднюю скорость за весь путь.", "options": ["50 км/ч", "55 км/ч", "60 км/ч", "65 км/ч", "75 км/ч"], "solution": "Весь путь: 300 км. Всё время: 5 ч. Средняя скорость: 300 ÷ 5 = 60 км/ч."}, "kz": {"title": "Сапар", "text": "Автокөлік 180 км-ді 3 сағатта, кейін 120 км-ді 2 сағатта жүрді. Аялдама болған жоқ. Бүкіл жолдағы орташа жылдамдығын табыңыз.", "options": ["50 км/сағ", "55 км/сағ", "60 км/сағ", "65 км/сағ", "75 км/сағ"], "solution": "Барлық жол: 300 км. Уақыт: 5 сағ. Орташа жылдамдық: 300 ÷ 5 = 60 км/сағ."}, "correct": 2}, {"id": "v2q4", "ready": true, "ru": {"title": "Плитка", "text": "Пол 4 × 3 м покрывают квадратной плиткой 50 × 50 см без зазоров. Сколько плиток нужно без запаса?", "options": ["12", "24", "36", "48", "60"], "solution": "Плитка: 0,5 × 0,5 = 0,25 м². Пол: 12 м². Нужно 12 ÷ 0,25 = 48 плиток."}, "kz": {"title": "Тақтайша", "text": "Өлшемі 4 × 3 м еденге 50 × 50 см шаршы тақтайшалар саңылаусыз төселеді. Қосымша қорсыз неше тақтайша керек?", "options": ["12", "24", "36", "48", "60"], "solution": "Тақтайша: 0,5 × 0,5 = 0,25 м². Еден: 12 м². 12 ÷ 0,25 = 48 тақтайша керек."}, "correct": 3}, {"id": "v2q5", "ready": true, "ru": {"title": "Медиана", "text": "Время пяти учеников на дистанции: 12, 15, 11, 18, 14 минут. Найдите медиану.", "options": ["11", "12", "14", "15", "18"], "solution": "Упорядочим: 11, 12, 14, 15, 18. Средний (третий) элемент — 14."}, "kz": {"title": "Медиана", "text": "Бес оқушының қашықтықты өту уақыты: 12, 15, 11, 18, 14 минут. Медиананы табыңыз.", "options": ["11", "12", "14", "15", "18"], "solution": "Реттейік: 11, 12, 14, 15, 18. Ортадағы (үшінші) сан — 14."}, "correct": 2}, {"id": "v2q6", "ready": true, "ru": {"title": "Команда", "text": "В клубе 6 учеников. Нужно выбрать двух представителей без назначения ролей. Сколько разных пар можно выбрать?", "options": ["6", "12", "15", "30", "36"], "solution": "6 × 5 считает каждую пару дважды. Поэтому 6 × 5 ÷ 2 = 15 пар."}, "kz": {"title": "Команда", "text": "Үйірмеде 6 оқушы бар. Рөлдерді бөлмей екі өкіл таңдау керек. Неше түрлі жұп таңдауға болады?", "options": ["6", "12", "15", "30", "36"], "solution": "6 × 5 әр жұпты екі рет санайды. Сондықтан 6 × 5 ÷ 2 = 15 жұп."}, "correct": 2}, {"id": "v2q7", "ready": true, "ru": {"title": "Рост растения", "text": "Таблица высоты растения:\nДень: 0 | 2 | 4 | 6\nВысота, см: 5 | 9 | 13 | 17\nЕсли рост останется таким же равномерным, какова высота на 8-й день?", "op const KEY='qadam.math.v1';let storageOK=true;
let data={bank:structuredClone(DEFAULT_BANK),attempts:{},history:[],lang:'ru'};
// A malformed backup cannot inject HTML: all teacher text is escaped before rendering.
function validBank(b){return Array.isArray(b)&&b.length===10&&b.every((v,i)=>v.id===i+1&&Array.isArray(v.questions)&&v.questions.length===10&&v.questions.every(q=>typeof q.ready==='boolean'&&Number.isInteger(q.correct)&&q.correct>=0&&q.correct<5&&['ru','kz'].every(l=>q[l]&&['title','text','solution'].every(k=>typeof q[l][k]==='string'&&q[l][k].trim())&&Array.isArray(q[l].options)&&q[l].options.length===5&&q[l].options.every(o=>typeof o==='string'&&o.trim()))));}
try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(validBank(d.bank)){data={...data,...d};if(!data.attempts||typeof data.attempts!=='object'||Array.isArray(data.attempts))data.attempts={};if(!Array.isArray(data.history))data.history=[];}}}catch(e){storageOK=false}
let lang=data.lang==='kz'?'kz':'ru',view='home',v=0,n=0,dirty=false;
const $=id=>document.getElementById(id),T=k=>I18N[lang][k],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,4500)}
function persist(){data.lang=lang;try{localStorage.setItem(KEY,JSON.stringify(data));storageOK=true}catch(e){storageOK=false;toast(T('storage'))}}
function ask(title,text,label,fn){$('dialogTitle').textContent=title;$('dialogText').textContent=text;$('cancel').textContent=T('cancel');$('accept').textContent=label;$('cancel').onclick=()=>$('confirm').close();$('accept').onclick=()=>{$('confirm').close();fn()};$('confirm').showModal()}
function guard(){return !dirty||window.confirm(T('unsaved'))}
function setLang(l){if(view==='editor')captureDraft();lang=l;persist();render()}
function toggleMode(){if(!guard())return;dirty=false;draft=null;view=view==='editor'?'home':'editor';render()}
function goHome(){if(!guard())return;dirty=false;draft=null;view='home';render()}
function ready(){return data.bank[v].questions.every(q=>q.ready)}
function attempt(){return data.attempts[v]}
function elapsed(a){return a?Math.max(0,Math.floor(((a.end||Date.now())-a.start)/1000)):0}
function clock(s){return Math.floor(s/60).toString().padStart(2,'0')+':'+(s%60).toString().padStart(2,'0')}
function openVariant(i){v=i;n=0;if(!ready()){toast(T('notready'));return}if(!attempt()){data.attempts[v]={answers:Array(10).fill(null),start:Date.now(),end:null};persist()}view=attempt().end?'result':'test';render()}
function restart(){ask(T('retryTitle'),T('retryText'),T('start'),()=>{data.attempts[v]={answers:Array(10).fill(null),start:Date.now(),end:null};n=0;view='test';persist();render()})}
function answer(i){if(!attempt().end){attempt().answers[n]=i;persist();render()}}
function finish(){const a=attempt();ask(T('finishTitle'),T('finishText')+' '+a.answers.filter(x=>x===null).length,T('yes'),()=>{a.end=Date.now();a.score=data.bank[v].questions.reduce((s,q,i)=>s+(a.answers[i]===q.correct?1:0),0);data.history.unshift({variant:v+1,score:a.score,seconds:elapsed(a),date:a.end});data.history=data.history.slice(0,50);persist();view='result';render()})}
function nums(review=false){return data.bank[v].questions.map((q,i)=>`<button aria-label="${T('question')} ${i+1}" aria-current="${n===i?'step':'false'}" class="${n===i?'active ':''}${review?(attempt().answers[i]===q.correct?'correct':'wrong'):(attempt().answers[i]!==null?'answered':'')}" onclick="n=${i};view='${review?'review':'test'}';render()">${i+1}</button>`).join('')}
function render(){document.documentElement.lang=lang==='kz'?'kk':'ru';document.title='Qadam · '+T('eyebrow');$('ru').className=lang==='ru'?'active':'';$('kz').className=lang==='kz'?'active':'';$('mode').textContent=T(view==='editor'?'student':'teacher');let out='';
if(view==='home'){out=`<div class="hero"><div><div class="eyebrow">${T('eyebrow')}</div><h1>${T('hero')}</h1><p class="muted">${T('intro')}</p></div><span class="pill">${T('badge')}</span></div><div class="grid">`+data.bank.map((b,i)=>{const count=b.questions.filter(q=>q.ready).length,a=data.attempts[i];return `<button class="card variant" onclick="openVariant(${i})"><span class="row between"><strong>${String(i+1).padStart(2,'0')}</strong><span class="pill">${count===10?'✓':T('template')}</span></span><span>${T('variant')} ${i+1}<br><small class="muted">${T('ready')}: ${count}/10</small></span><small>${a?.end?T('review'):a?T('resume'):T('start')} →</small></button>`}).join('')+'</div><section class="history"><h2>'+T('history')+'</h2>'+ (data.history.length?data.history.slice(0,10).map(h=>`<div class="panel row between" style="margin-bottom:8px"><span>${T('variant')} ${esc(h.variant)} · ${new Date(h.date).toLocaleString(lang==='kz'?'kk-KZ':'ru-KZ')}</span><strong>${esc(h.score)}/10 · ${clock(h.seconds)}</strong></div>`).join(''):`<p class="muted">${T('empty')}</p>`)+'</section>';
}else if(view==='editor'){out=editorHTML();
}else if(view==='result'){const a=attempt();out=`<button onclick="goHome()">← ${T('home')}</button><section class="panel" style="margin-top:20px"><span class="eyebrow">${T('variant')} ${v+1}</span><h1>${T('result')}</h1><div class="stats"><div class="stat"><strong>${a.score}/10</strong>${T('points')}</div><div class="stat"><strong>${a.score*10}%</strong>${T('percent')}</div><div class="stat"><strong>${clock(elapsed(a))}</strong>${T('time')} (${T('duration')})</div></div><div class="row"><button class="primary" onclick="n=0;view='review';render()">${T('review')} →</button><button onclick="restart()">${T('retry')}</button></div><div class="numbers">${nums(true)}</div></section>`;
}else{const a=attempt(),q=data.bank[v].questions[n],b=q[lang],review=view==='review';out=`<div class="workspace"><aside class="panel sidebar"><button onclick="goHome()">← ${T('home')}</button><h2 style="margin-top:24px">${T('variant')} ${v+1}</h2><p>${T('answered')}: ${a.answers.filter(x=>x!==null).length}/10</p><div class="numbers">${nums(review)}</div><p class="muted">${T('legend')}</p><hr style="border:0;border-top:1px solid var(--line)"><p>${T('time')}: <strong id="timer">${clock(elapsed(a))}</strong></p><small class="muted">${T('saved')}</small></aside><section class="panel"><div class="row between"><span class="eyebrow">${T('question')} ${n+1} ${T('of')} 10</span><span class="pill">${esc(b.title)}</span></div><div class="question">${esc(b.text)}</div><div class="options">${b.options.map((o,i)=>`<button ${review?'disabled':''} aria-pressed="${a.answers[n]===i}" class="option ${a.answers[n]===i?'selected':''} ${review&&i===q.correct?'correct':''} ${review&&a.answers[n]===i&&i!==q.correct?'wrong':''}" onclick="answer(${i})"><span class="letter">${'ABCDE'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>${review?`<div class="solution"><strong>${a.answers[n]===q.correct?T('correctMark'):T('wrongMark')}</strong><br>${T('your')}: ${a.answers[n]===null?T('none'):'ABCDE'[a.answers[n]]} · ${T('right')}: ${'ABCDE'[q.correct]}<br><br><strong>${T('solution')}</strong><br>${esc(b.solution)}</div>`:`<button style="margin-top:12px" onclick="answer(null)" ${a.answers[n]===null?'disabled':''}>${T('clear')}</button>`}<div class="row between actions"><button onclick="n--;render()" ${n===0?'disabled':''}>← ${T('prev')}</button><button onclick="n++;render()" ${n===9?'disabled':''}>${T('next')} →</button></div><div class="actions"><button class="primary" onclick="${review?"view='result';render()":"finish()"}">${T(review?'back':'finish')}</button></div></section></div>`}
$('app').innerHTML=out+(!storageOK?`<div class="notice" role="alert">${T('storage')}</div>`:'')+`<footer>${T('footer')}</footer>`;if(view==='editor')$('editForm').addEventListener('input',()=>dirty=true);}
// Teacher editor replaces a slot; it never silently creates an eleventh question.
let draft=null;
function captureDraft(){if(!$('editForm'))return;draft=structuredClone(data.bank[v].questions[n]);for(const l of ['ru','kz']){for(const k of ['title','text','solution'])draft[l][k]=$(l+'_'+k).value;draft[l].options=Array.from({length:5},(_,i)=>$(l+'_o'+i).value)}draft.correct=Number($('correct').value);draft.ready=$('ready').checked}
function selectEditor(kind,value){if(!guard()){render();return}dirty=false;draft=null;if(kind==='v'){v=Number(value);n=0}else n=Number(value);render()}
function firstTemplate(){if(!guard())return;const i=data.bank[v].questions.findIndex(q=>!q.ready);if(i<0){toast(T('full'));return}n=i;dirty=false;draft=null;render()}
function editorHTML(){const q=draft||data.bank[v].questions[n];return `<div class="eyebrow">Qadam / Studio</div><h1>${T('editor')}</h1><p class="muted">${T('editorIntro')}</p><div class="notice">${T('local')}</div><div class="panel"><div class="row"><label>${T('variant')} <select class="inline" onchange="selectEditor('v',this.value)">${data.bank.map((b,i)=>`<option value="${i}" ${i===v?'selected':''}>${i+1}</option>`).join('')}</select></label><label>${T('question')} <select class="inline" onchange="selectEditor('n',this.value)">${data.bank[v].questions.map((q,i)=>`<option value="${i}" ${i===n?'selected':''}>${i+1} ${q.ready?'✓':'○'}</option>`).join('')}</select></label><button onclick="firstTemplate()">+ ${T('add')}</button></div><form id="editForm" onsubmit="event.preventDefault();saveTask()"><div class="editorcols">${['ru','kz'].map(l=>`<section><h2 style="margin-top:24px">${l==='ru'?'Русский':'Қазақша'}</h2><label class="field">${T('title')}<input id="${l}_title" required value="${esc(q[l].title)}"></label><label class="field">${T('text')}<textarea id="${l}_text" required>${esc(q[l].text)}</textarea></label><div class="field">${T('options')}</div>${q[l].options.map((o,i)=>`<label class="row" style="margin:8px 0"><span>${'ABCDE'[i]}</span><input style="flex:1;width:80%" aria-label="${l} ${'ABCDE'[i]}" id="${l}_o${i}" required value="${esc(o)}"></label>`).join('')}<label class="field">${T('explanation')}<textarea required id="${l}_solution">${esc(q[l].solution)}</textarea></label></section>`).join('')}</div><div class="row"><label>${T('correct')} <select class="inline" id="correct">${[0,1,2,3,4].map(i=>`<option value="${i}" ${i===q.correct?'selected':''}>${'ABCDE'[i]}</option>`).join('')}</select></label><label><input type="checkbox" class="inline" id="ready" ${q.ready?'checked':''}> ${T('published')}</label></div><button class="primary actions" type="submit">${T('save')}</button></form></div><div class="row actions"><button onclick="exportBank()">↓ ${T('export')}</button><button onclick="document.getElementById('importFile').click()">↑ ${T('import')}</button><input type="file" id="importFile" accept=".json,application/json" hidden onchange="importBank(this.files[0])"><button class="danger" onclick="resetBank()">${T('reset')}</button></div>`}
function saveTask(){captureDraft();const candidate=structuredClone(data.bank);candidate[v].questions[n]=draft;if(!validBank(candidate)){toast(T('valid'));return}const apply=()=>{data.bank=candidate;delete data.attempts[v];dirty=false;draft=null;persist();render();toast(T('savedTask'))};if(attempt())ask(T('editConfirm'),T('editText'),T('save'),apply);else apply()}
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportBank(){download(JSON.stringify({schemaVersion:1,bank:data.bank},null,2),'qadam-tasks.json','application/json')}
async function importBank(file){if(!file)return;if(!guard())return;try{if(file.size>5000000)throw Error();const parsed=JSON.parse(await file.text());if(parsed.schemaVersion!==1||!validBank(parsed.bank))throw Error();ask(T('replaceTitle'),T('replaceText'),T('replace'),()=>{data.bank=structuredClone(parsed.bank);data.attempts={};dirty=false;draft=null;persist();render();toast(T('imported'))})}catch(e){toast(T('invalid'))}}
function resetBank(){if(!guard())return;ask(T('replaceTitle'),T('replaceText'),T('replace'),()=>{data.bank=structuredClone(DEFAULT_BANK);data.attempts={};dirty=false;draft=null;persist();render()})}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
setInterval(()=>{if($('timer'))$('timer').textContent=clock(elapsed(attempt()))},1000);
// Attempt state is persisted on every answer, never only on unload.
render();
</script></body></html>
