function validateState(x){
 if(!x||x.version!==1||!Array.isArray(x.lessons)||x.lessons.length>1500||!Array.isArray(x.projects)||x.projects.length>1000||!Array.isArray(x.qrLinks)||x.qrLinks.length>1000||!Array.isArray(x.favorites)||!x.config)throw Error('Invalid backup');

 const date=v=>{str(v,10);if(v&&!/^\d{4}-\d{2}-\d{2}$/.test(v))throw Error('Invalid date');return v;};
 const ids=new Set();const lessons=x.lessons.map(l=>{const id=str(l.id,100);if(ids.has(id)||!id||!Object.hasOwn(MO,l.mo)||!Object.hasOwn(STATUS,l.status))throw Error('Invalid lesson');ids.add(id);return {id,title:str(l.title,200),subjects:str(l.subjects,250),mo:l.mo,grade:integer(l.grade,0,11),month:integer(l.month,0,12),language:['ru','kk','en'].includes(l.language)?l.language:'ru',status:l.status,goals:str(l.goals),content:str(l.content),task:str(l.task),profession:str(l.profession,250),url:safeURL(l.url),source:str(l.source,300),updated:date(l.updated)};});
 const pids=new Set();const projects=x.projects.map(p=>{const id=str(p.id,100);if(pids.has(id)||!Object.hasOwn(PSTATUS,p.status))throw Error('Invalid project');pids.add(id);const total=integer(p.total,0,100000),achieved=integer(p.achieved,0,total);return {id,title:str(p.title,200),lessonId:str(p.lessonId,100),date:date(p.date),status:p.status,notes:str(p.notes),criterion:str(p.criterion,2000),total,achieved};});

}

ass="field full">${t('Содержание и ход урока','Мазмұны және сабақ барысы')}<textarea name="content" rows="7" maxlength="30000">${esc(l.content)}</textarea></label><label class="field full">${t('Контекстное задание / критерии оценивания','Мәнмәтіндік тапсырма / бағалау критерийлері')}<textarea name="task" maxlength="30000">${esc(l.task)}</textarea></label><label class="field full">${t('Связь с профессиями','Мамандықтармен байланыс')}<input name="profession" maxlength="250" value="${esc(l.profession)}"><small>${t('Если ссылаетесь на Атлас профессий, укажите проверенное название.','Мамандықтар атласына сүйенсеңіз, тексерілген атауды жазыңыз.')}</small></label><label class="field full">${t('Ссылка на документ, видео или задание','Құжат, бейне немесе тапсырма сілтемесі')}<input name="url" type="url" maxlength="2000" placeholder="https://…" value="${esc(l.url)}"><small>${t('Файл остаётся в выбранном вами хранилище; здесь хранится его ссылка.','Файл таңдаған қоймаңызда қалады; мұнда сілтемесі сақталады.')}</small></label><div class="actions full"><button class="btn primary">${icon('check')}${t('Сохранить карточку','Карточканы сақтау')}</button>${btn(t('Отмена','Бас тарту'),'close')}</div></form>`);}

function qrView(){return `${head(t('Банк QR-кодов','QR-кодтар банкі'),t('Превратите ссылку на материал в код для экрана, презентации или печати.','Материал сілтемесін экранға, презентацияға немесе басып шығаруға арналған кодқа айналдырыңыз.'))}<div class="two-col"><section class="panel"><h2>${t('Новый QR-код','Жаңа QR-код')}</h2><form id="qr-form" class="form-grid"><label class="field full">${t('Название материала','Материал атауы')}<input name="title" id="qr-title" maxlength="200" placeholder="${t('Например, задание по энергосбережению','Мысалы, энергия үнемдеу тапсырмасы')}"></label><label class="field full">${t('Ссылка *','Сілтеме *')}<input name="url" id="qr-url" type="url" required maxlength="1500" placeholder="https://…" value="${esc(qrValue)}"></label><button class="btn primary full">${icon('qr')}${t('Создать QR-код','QR-код жасау')}</button></form><div class="qr-preview" id="qr-preview">${qrSVG||`<span class="muted small">${t('Здесь появится ваш QR-код','QR-кодыңыз осы жерде пайда болады')}</span>`}</div><div class="actions" id="qr-actions" ${qrSVG?'':'hidden'}>${btn(icon('download')+'SVG','download-qr')}${btn(icon('plus')+t('Сохранить в банк','Банкке сақтау'),'save-qr')}${btn(icon('copy')+t('Копировать ссылку','Сілтемені көшіру'),'copy-qr')}</div></section><section class="panel"><h2>${t('Чтобы ссылка открылась у учеников','Оқушылар сілтемені аша алуы үшін')}</h2><ol class="help-list"><li>${t('Опубликуйте материал','Материалды жариялаңыз')}<small>${t('QR-код не загружает файл в интернет. Сначала получите доступную ссылку.','QR-код файлды интернетке жүктемейді. Алдымен қолжетімді сілтеме алыңыз.')}</small></li><li>${t('Проверьте права просмотра','Көру рұқсатын тексеріңіз')}<small>${t('Откройте ссылку в приватном окне браузера.','Сілтемені браузердің жеке терезесінде ашыңыз.')}</small></li><li>${t('Проверьте камерой телефона','Телефон камерасымен тексеріңіз')}<small>${t('Не обрезайте белую рамку вокруг кода при печати.','Басып шығарғанда код айналасындағы ақ жиекті кеспеңіз.')}</small></li></ol></section></div><div class="section-head"><h2>${t('Сохранённые ссылки','Сақталған сілтемелер')}</h2><span class="small muted">${state.qrLinks.length}</span></div><div class="grid">${state.qrLinks.map(q=>`<article class="card"><div class="tool-icon lilac">${icon('qr')}</div><h3 style="margin-top:14px">${esc(q.title)}</h3><p>${esc(q.url)}</p><div class="actions">${btn(t('Показать QR','QR көрсету'),'open-qr',`data-id="${esc(q.id)}"`,'small')}<a class="btn small" href="${esc(q.url)}" target="_blank" rel="noopener noreferrer">${t('Открыть','Ашу')}</a>${btn(t('Удалить','Жою'),'delete-qr',`data-id="${esc(q.id)}"`,'small danger')}</div></article>`).join('')||empty(t('Ваш банк пока пуст','Банкіңіз әзірге бос'),t('Создайте первый код и сохраните его.','Алғашқы кодты жасап, сақтаңыз.'))}</div>`;}
function makeQR(value){const url=safeURL(value).replace(/[^\x00-\x7F]/g,c=>encodeURIComponent(c));if(!url||url.length>1500)throw Error(t('Используйте ссылку длиной до 1500 символов.','1500 таңбадан аспайтын сілтемені қолданыңыз.'));const qr=new window.SferaQR(-1,0);qr.addData(url);qr.make();const n=qr.getModuleCount(),size=n+8;let path='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))path+=`M${c+4} ${r+4}h1v1h-1z`;qrSVG=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" role="img" aria-label="QR code" shape-rendering="crispEdges"><rect width="${size}" height="${size}" fill="white"/><path d="${path}" fill="black"/></svg>`;qrValue=url;return qrSVG;}
const EXERCISES=[{id:'energy',title:['Энергия школьного кабинета','Мектеп кабинетіндегі энергия'],area:['Математическая грамотность · 7–9 классы','Математикалық сауаттылық · 7–9 сынып'],body:['В кабинете 5 ламп по 60 Вт. Они работают 4 часа в день, 30 дней. Их заменили на 5 LED-ламп по 9 Вт с тем же временем работы. Сколько киловатт-часов экономится за эти 30 дней?','Кабинетте 60 Вт-тан 5 шам бар. Олар күніне 4 сағаттан 30 күн жанады. Оларды 9 Вт-тан 5 LED-шамға ауыстырды. Жұмыс уақыты өзгермеді. Осы 30 күнде неше киловатт-сағат үнемделеді?'],unit:'кВт·ч / кВт·сағ',answer:30.6,solution:['Мощность до замены: 5 × 60 = 300 Вт = 0,3 кВт. После: 5 × 9 = 45 Вт = 0,045 кВт. За 120 часов экономия: (0,3 − 0,045) × 120 = 30,6 кВт·ч.','Бастапқы қуат: 5 × 60 = 300 Вт = 0,3 кВт. Кейін: 5 × 9 = 45 Вт = 0,045 кВт. 120 сағаттағы үнем: (0,3 − 0,045) × 120 = 30,6 кВт·сағ.']},{id:'water',title:['Сколько воды можно сохранить?','Қанша су үнемдеуге болады?'],area:['Естественно-научный контекст · 6–8 классы','Жаратылыстану мәнмәтіні · 6–8 сынып'],body:['Обычный кран расходует 9 литров в минуту, кран с аэратором — 6 литров. В обоих случаях воду включают на 10 минут в день. Сколько литров сэкономит аэратор за 7 дней?','Кәдімгі кран минутына 9 литр, аэраторы бар кран 6 литр су жұмсайды. Екі жағдайда да су күніне 10 минут ағады. Аэратор 7 күнде неше литр су үнемдейді?'],unit:['литров','литр'],answer:210,solution:['Разница расходов: 9 − 6 = 3 л/мин. В день: 3 × 10 = 30 л. За неделю: 30 × 7 = 210 л.','Шығын айырмасы: 9 − 6 = 3 л/мин. Күніне: 3 × 10 = 30 л. Аптасына: 30 × 7 = 210 л.']},{id:'map',title:['Школьный двор на плане','Жоспардағы мектеп ауласы'],area:['Геометрия в жизни · 6–8 классы','Өмірдегі геометрия · 6–8 сынып'],body:['На плане масштаба 1:500 прямоугольная площадка имеет длину 6 см и ширину 4 см. Найдите её реальную площадь в квадратных метрах.','Масштабы 1:500 жоспардағы тік төртбұрышты алаңның ұзындығы 6 см, ені 4 см. Нақты ауданын шаршы метрмен табыңыз.'],unit:'м²',answer:600,solution:['1 см на плане соответствует 5 м. Длина: 6 × 5 = 30 м, ширина: 4 × 5 = 20 м. Площадь: 30 × 20 = 600 м².','Жоспардағы 1 см — 5 м. Ұзындығы: 6 × 5 = 30 м, ені: 4 × 5 = 20 м. Ауданы: 30 × 20 = 600 м².']}];
function trainingView(){return `${head(t('Практика функциональной грамотности','Функционалдық сауаттылық практикасы'),t('Контекст → расчёт → объяснение. Три упражнения для знакомства с форматом.','Мәнмәтін → есептеу → түсіндіру. Форматпен танысуға арналған үш жаттығу.'))}<div class="notice">${t('Авторские демонстрационные упражнения. Это не официальные задания PISA или TIMSS и не стандартизированная диагностика. Ответы не отправляются и не сохраняются.','Авторлық демонстрациялық жаттығулар. Бұлар PISA немесе TIMSS ресми тапсырмалары да, стандартталған диагностика да емес. Жауаптар жіберілмейді және сақталмайды.')}</div><div class="grid">${EXERCISES.map((e,i)=>`<article class="card"><div class="row between"><span class="tag">0${i+1}</span>${icon('bulb')}</div><h3 style="margin-top:16px">${tr(e.title)}</h3><p>${tr(e.area)}</p><p style="display:block;color:var(--ink);font-size:14px;line-height:1.7">${tr(e.body)}</p><form class="exercise-form" data-id="${e.id}" style="margin-top:auto"><label class="field">${t('Ответ','Жауап')} (${tr(e.unit)})<input name="answer" required inputmode="decimal" maxlength="30" placeholder="0"></label><button class="btn primary" style="margin-top:13px">${t('Проверить','Тексеру')}</button></form><div id="feedback-${e.id}" aria-live="polite"></div></article>`).join('')}</div>`;}
function planView(){let projects=state.projects.filter(p=>projectFilter==='all'||p.status===projectFilter).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));return `${head(t('Мой план работы','Менің жұмыс жоспарым'),t('Планируйте интегрированные уроки и фиксируйте общие результаты без данных учеников.','Кіріктірілген сабақтарды жоспарлап, оқушы деректерінсіз жалпы нәтижелерді тіркеңіз.'),btn(icon('plus')+t('Добавить в план','Жоспарға қосу'),'new-project','','primary'))}<div class="tabs">${[['all',t('Все','Барлығы')],...Object.entries(PSTATUS).map(([k,v])=>[k,tr(v)])].map(([k,v])=>`<button data-action="project-filter" data-id="${k}" class="${projectFilter===k?'active':''}" aria-pressed="${projectFilter===k}">${v}</button>`).join('')}</div><div class="panel">${projects.map(p=>`<article class="project-row"><div><div class="tags"><span class="tag ${p.status==='done'?'green':'amber'}">${tr(PSTATUS[p.status])}</span><span class="tag">${p.date?esc(p.date):t('Дата не задана','Күні көрсетілмеген')}</span></div><h3 style="margin-top:9px">${esc(p.title)}</h3><p>${p.status==='done'&&p.total?`${t('Достигли критерия','Критерийге жеткендер')}: ${p.achieved} / ${p.total} (${Math.round(p.achieved/p.total*100)}%)`:t('Откройте карточку, чтобы дополнить план и результаты.','Жоспар мен нәтижелерді толықтыру үшін карточканы ашыңыз.')}</p></div>${btn(icon('edit')+t('Открыть','Ашу'),'edit-project',`data-id="${esc(p.id)}"`,'small')}</article>`).join('')||empty(t('Запланируйте первый урок','Алғашқы сабақты жоспарлаңыз'),t('Начните с карточки в каталоге или создайте запись здесь.','Каталог карточкасынан бастаңыз немесе осында жазба жасаңыз.'),btn(t('Открыть каталог','Каталогты ашу'),'go-catalog'))}</div>`;}
function projectForm(id='',lessonId=''){const l=state.lessons.find(x=>x.id===lessonId);const p=state.projects.find(x=>x.id===id)||{title:l?.title||'',lessonId:lessonId,date:'',status:'planned',notes:'',criterion:'',total:0,achieved:0};editingId=id;showModal(t('План и результат урока','Сабақ жоспары мен нәтижесі'),`<form id="project-form" class="form-grid"><label class="field full">${t('Название *','Атауы *')}<input name="title" required maxlength="200" value="${esc(p.title)}"></label><label class="field full">${t('Связанный урок','Байланысты сабақ')}<select name="lessonId">${opt('',t('Без связи с каталогом','Каталогқа байланыссыз'),p.lessonId)}${state.lessons.map(l=>opt(l.id,l.title,p.lessonId)).join('')}</select></label><label class="field">${t('Дата','Күні')}<input type="date" name="date" value="${esc(p.date)}"></label><label class="field">${t('Статус','Мәртебесі')}<select name="status">${Object.entries(PSTATUS).map(([v,n])=>opt(v,tr(n),p.status)).join('')}</select></label><label class="field full">${t('План / договорённости / следующий шаг','Жоспар / келісімдер / келесі қадам')}<textarea name="notes" rows="5" maxlength="30000">${esc(p.notes)}</textarea></label><label class="field full">${t('Критерий достижения результата','Нәтижеге жету критерийі')}<textarea name="criterion" maxlength="2000" placeholder="${t('Например, верно перевести Вт в кВт и обосновать расчёт.','Мысалы, Вт-ты кВт-қа дұрыс айналдырып, есептеуді негіздеу.')}">${esc(p.criterion)}</textarea></label><label class="field">${t('Участников','Қатысушылар саны')}<input type="number" min="0" max="100000" step="1" name="total" value="${p.total}" required></label><label class="field">${t('Достигли критерия','Критерийге жеткендер')}<input type="number" min="0" max="100000" step="1" name="achieved" value="${p.achieved}" required></label><p class="small muted full">${t('Только суммарные числа. Не вносите фамилии и индивидуальные оценки учеников.','Тек жиынтық сандар. Оқушылардың аты-жөні мен жеке бағаларын енгізбеңіз.')}</p><div class="actions full"><button class="btn primary">${t('Сохранить','Сақтау')}</button>${id?btn(t('Удалить запись','Жазбаны жою'),'delete-project',`data-id="${esc(id)}"`,'danger'):''}${btn(t('Отмена','Бас тарту'),'close')}</div></form>`);}
function analyticsView(){const total=state.lessons.length;const done=state.projects.filter(p=>p.status==='done');return `${head(t('Аналитика методобъединений','Әдістемелік бірлестіктер аналитикасы'),t('Показатели рассчитаны по каталогу и плану в вашей рабочей копии.','Көрсеткіштер жұмыс көшірмеңіздегі каталог пен жоспар бойынша есептелген.'),btn(icon('download')+'CSV','analytics-csv'))}<div class="notice">${t('Это состав каталога, а не рейтинг качества работы педагогов. Общешкольная синхронизация не подключена.','Бұл мұғалімдер жұмысының сапа рейтингі емес, каталог құрамы. Мектеп бойынша синхрондау қосылмаған.')}</div><section class="panel"><h2>${t('Материалы по направлениям','Бағыттар бойынша материалдар')}</h2><div class="table-wrap"><table><thead><tr><th>${t('Методобъединение','Әдістемелік бірлестік')}</th><th>${t('Всего','Барлығы')}</th><th>${t('Идеи','Идеялар')}</th><th>${t('Черновики','Жобалар')}</th><th>${t('Проверено','Тексерілген')}</th><th>${t('Доля каталога','Каталог үлесі')}</th></tr></thead><tbody>${Object.entries(MO).map(([id,name])=>{const rows=state.lessons.filter(l=>l.mo===id),share=total?Math.round(rows.length/total*100):0;return `<tr><td>${esc(tr(name))}</td><td>${rows.length}</td><td>${rows.filter(l=>l.status==='idea').length}</td><td>${rows.filter(l=>l.status==='draft').length}</td><td>${rows.filter(l=>l.status==='ready').length}</td><td>${share}%<div class="bar"><span style="width:${share}%"></span></div></td></tr>`;}).join('')}</tbody></table></div></section><div class="section-head"><h2>${t('Результаты проведённых уроков','Өткізілген сабақтардың нәтижелері')}</h2><span class="small muted">${done.length} ${t('завершено','аяқталған')}</span></div><div class="grid">${done.map(p=>`<article class="card"><span class="tag green">${esc(p.date)||t('Без даты','Күні жоқ')}</span><h3 style="margin-top:15px">${esc(p.title)}</h3><div class="result-number">${p.total?Math.round(p.achieved/p.total*100)+'%':'—'}</div><p style="display:block">${p.total?`${p.achieved} / ${p.total} · `:''}${esc(p.criterion)||t('Критерий не заполнен','Критерий толтырылмаған')}</p><span class="small muted">${t('Достигли указанного критерия','Көрсетілген критерийге жеткендер')}</span></article>`).join('')||empty(t('Результатов пока нет','Нәтижелер әзірге жоқ'),t('Завершите запись в разделе «Мой план» и внесите итоговые числа.','«Менің жоспарым» бөліміндегі жазбаны аяқтап, қорытынды сандарды енгізіңіз.'))}</div>`;}
function assistantView(){return `${head(t('Конструктор запроса к ИИ','ЖИ-ге сұрау құрастырушы'),t('Заполните данные урока — получите текст, который можно перенести в любой ИИ-чат.','Сабақ деректерін толтырыңыз — кез келген ЖИ чатына көшіруге болатын мәтін алыңыз.'))}<div class="notice">${t('ИИ не подключён к сайту. Инструмент собирает запрос по шаблону; ответ вы получите в выбранном чате.','Сайтқа ЖИ қосылмаған. Құрал үлгі бойынша сұрау құрастырады; жауапты таңдаған чатта аласыз.')}</div><div class="two-col"><section class="panel"><form id="prompt-form" class="form-grid"><label class="field full">${t('Что подготовить?','Не дайындау керек?')}<select name="kind">${['План интегрированного урока','Контекстные задания','Рабочий лист','Идеи межпредметного проекта'].map((n,i)=>opt(i,t(n,['Кіріктірілген сабақ жоспары','Мәнмәтіндік тапсырмалар','Жұмыс парағы','Пәнаралық жоба идеялары'][i]),0)).join('')}</select></label><label class="field full">${t('Тема *','Тақырыбы *')}<input name="topic" required maxlength="300"></label><label class="field">${t('Предметы *','Пәндер *')}<input name="subjects" required maxlength="250" placeholder="Алгебра + Физика"></label><label class="field">${t('Класс','Сынып')}<select name="grade">${Array.from({length:11},(_,i)=>opt(i+1,i+1,9)).join('')}</select></label><label class="field">${t('Продолжительность, минут','Ұзақтығы, минут')}<input type="number" name="minutes" min="10" max="180" value="45" required></label><label class="field">${t('Язык результата','Нәтиже тілі')}<select name="language"><option>Русский</option><option>Қазақша</option><option>English</option></select></label><label class="field full">${t('Точные цели из программы *','Бағдарламадағы нақты мақсаттар *')}<textarea name="goals" required maxlength="6000" placeholder="${t('Скопируйте код и формулировку. Конструктор не придумывает учебные цели.','Код пен тұжырымдаманы көшіріңіз. Құрастырушы оқу мақсаттарын ойдан шығармайды.')}"></textarea></label><label class="field full">${t('Ресурсы и особенности класса','Ресурстар мен сынып ерекшеліктері')}<textarea name="context" maxlength="3000" placeholder="${t('Например: проектор, работа в парах, без телефонов.','Мысалы: проектор, жұптық жұмыс, телефонсыз.')}" rows="3"></textarea></label><button class="btn primary full">${icon('spark')}${t('Собрать запрос','Сұрау құрастыру')}</button></form></section><section class="panel"><h2>${t('Готовый запрос','Дайын сұрау')}</h2><label class="field"><span class="small muted">${t('Можно отредактировать перед копированием','Көшірер алдында өңдеуге болады')}</span><textarea id="prompt-output" class="output" rows="16" placeholder="${t('Здесь появится текст вашего запроса.','Сұрау мәтініңіз осында пайда болады.')}">${esc(promptValue)}</textarea></label><div class="actions">${btn(icon('copy')+t('Копировать','Көшіру'),'copy-prompt')}${btn(icon('download')+'TXT','download-prompt')}</div><p class="small muted" style="margin-top:18px">${t('Проверьте цели, факты и ответы в полученном материале перед использованием. Текст запроса не сохраняется после закрытия файла.','Алынған материалды қолданар алдында мақсаттар, деректер мен жауаптарды тексеріңіз. Файл жабылғаннан кейін сұрау мәтіні сақталмайды.')}</p></section></div>`;}
function settingsView(){return `${head(t('Настройки и помощь','Баптаулар және көмек'),t('Управляйте своей рабочей копией и готовьте каталог к публикации.','Жұмыс көшірмеңізді басқарып, каталогты жариялауға дайындаңыз.'))}<div class="two-col"><div><section class="panel"><h2>${t('Информация о школе','Мектеп туралы ақпарат')}</h2><form id="settings-form" class="form-grid"><label class="field full">${t('Название на русском','Орысша атауы')}<input name="school" required maxlength="250" value="${esc(state.config.school)}"></label><label class="field full">${t('Название на казахском','Қазақша атауы')}<input name="schoolKk" required maxlength="250" value="${esc(state.config.schoolKk)}"></label><button class="btn primary full">${t('Сохранить настройки','Баптауларды сақтау')}</button></form></section><section class="panel" style="margin-top:20px"><h2>${t('Резервная копия','Сақтық көшірме')}</h2><p>${t('Содержит каталог, избранное, план и ссылки QR. Переносите её между компьютерами или храните перед обновлением.','Каталог, таңдаулылар, жоспар және QR сілтемелері кіреді. Компьютерлер арасында тасымалдаңыз немесе жаңартар алдында сақтаңыз.')}</p><div class="actions">${btn(icon('download')+t('Скачать копию JSON','JSON көшірмесін жүктеу'),'backup','','primary')}${btn(t('Восстановить из файла','Файлдан қалпына келтіру'),'import')}</div><p class="small muted" style="margin-top:15px">${t('Восстановление заменяет текущую рабочую копию целиком. Браузер может удалить данные при очистке истории.','Қалпына келтіру ағымдағы жұмыс көшірмесін толығымен ауыстырады. Тарихты тазалағанда браузер деректерді жоюы мүмкін.')}</p></section><section class="panel" style="margin-top:20px"><h2>${t('Каталог для публикации','Жариялауға арналған каталог')}</h2><p>${t('Скачайте новый index.html с текущими карточками и названием школы. Личный план, избранное и банк QR в него не входят. Все карточки, включая черновики, будут видны посетителям после публикации.','Ағымдағы карточкалар мен мектеп атауы бар жаңа index.html жүктеңіз. Жеке жоспар, таңдаулылар және QR банкі оған кірмейді. Жариялағаннан кейін барлық карточкалар, оның ішінде жобалар да келушілерге көрінеді.')}</p>${btn(icon('download')+t('Скачать сайт с моим каталогом','Өз каталогыммен сайтты жүктеу'),'publish-export','','primary')}${state.revision!==SEED.revision?`<div class="actions">${btn(t('Применить каталог из нового файла','Жаңа файл каталогын қолдану'),'apply-seed')}</div>`:''}</section></div><div><section class="panel"><h2>${t('Первый запуск за 5 шагов','5 қадаммен алғашқы іске қосу')}</h2><ol class="help-list"><li>${t('Откройте банк уроков','Сабақтар банкін ашыңыз')}<small>${t('Темы перенесены из вашего сайта. Добавьте класс, цели и содержание.','Тақырыптар сайтыңыздан көшірілген. Сыныпты, мақсаттар мен мазмұнды қосыңыз.')}</small></li><li>${t('Прикрепите материалы','Материалдарды тіркеңіз')}<small>${t('В карточке укажите доступную ссылку на документ или задание.','Карточкада құжатқа не тапсырмаға қолжетімді сілтемені енгізіңіз.')}</small></li><li>${t('Составьте свой план','Өз жоспарыңызды құрыңыз')}<small>${t('Добавьте урок, дату, критерий и затем результат.','Сабақты, күнін, критерийін, кейін нәтижесін қосыңыз.')}</small></li><li>${t('Сделайте резервную копию','Сақтық көшірме жасаңыз')}<small>${t('Нажмите «Скачать копию JSON» после значимых изменений.','Маңызды өзгерістерден кейін «JSON көшірмесін жүктеу» батырмасын басыңыз.')}</small></li><li>${t('Опубликуйте каталог','Каталогты жариялаңыз')}<small>${t('Скачайте сайт с каталогом и загрузите index.html на хостинг. Подробная инструкция — в файле start.html из архива.','Сайтты каталогпен бірге жүктеп, index.html файлын хостингке салыңыз. Толық нұсқаулық архивтегі start.html файлында.')}</small></li></ol></section><section class="panel" style="margin-top:20px"><h2>${t('Как хранятся изменения','Өзгерістер қалай сақталады')}</h2><p>${t('Это самостоятельное приложение без регистрации. Каждый браузер хранит свою копию. Изменение на компьютере учителя не изменит сайт у коллег. Общая база, учётные записи и совместное редактирование потребуют отдельного сервера.','Бұл тіркелусіз дербес қолданба. Әр браузер өз көшірмесін сақтайды. Бір мұғалімнің компьютеріндегі өзгеріс әріптестерінің сайтын өзгертпейді. Ортақ база, тіркелгілер және бірлескен өңдеу үшін бөлек сервер қажет.')}</p><p>${t('Казахский переключатель переводит интерфейс. Тексты добавленных материалов остаются на языке автора.','Қазақша ауыстырғыш интерфейсті аударады. Қосылған материал мәтіндері автор тілінде қалады.')}</p><a href="https://project460134.tilda.ws/" target="_blank" rel="noopener noreferrer" class="btn small">${t('Исходный сайт на Тильде','Тильдадағы бастапқы сайт')} ${icon('link')}</a></section></div></div>`;}
function render(){renderShell();const views={home:homeView,catalog:()=>catalogView(false),favorites:()=>catalogView(true),qr:qrView,training:trainingView,plan:planView,analytics:analyticsView,assistant:assistantView,settings:settingsView};$('#main').innerHTML=views[route]()+footer();renderBanner();}
function download(name,content,type='text/plain;charset=utf-8'){const blob=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),30000);}
async function copy(text){if(!text.trim()){notify(t('Сначала создайте текст.','Алдымен мәтінді жасаңыз.'));return;}try{await navigator.clipboard.writeText(text);notify(t('Скопировано','Көшірілді'));}catch(e){showModal(t('Скопируйте текст вручную','Мәтінді қолмен көшіріңіз'),`<label class="field">${t('Выделите текст и нажмите Ctrl+C или ⌘C','Мәтінді белгілеп, Ctrl+C немесе ⌘C басыңыз')}<textarea rows="12" id="copy-fallback">${esc(text)}</textarea></label>`);$('#copy-fallback').select();}}
function csv(rows){return '\uFEFF'+rows.map(row=>row.map(value=>{let s=String(value??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}).join(';')).join('\r\n');}
function publishExport(){if(!confirm(t('Все карточки каталога будут включены в файл для публикации. Личный план и избранное не включаются. Продолжить?','Каталогтың барлық карточкалары жариялау файлына кіреді. Жеке жоспар мен таңдаулылар кірмейді. Жалғастыру керек пе?')))return;const next={version:1,revision:'published-'+Date.now(),config:state.config,lessons:state.lessons};const doc=new DOMParser().parseFromString(SOURCE_HTML,'text/html');doc.getElementById('seed-data').textContent=JSON.stringify(next).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');download('index.html','<!DOCTYPE html>\n'+doc.documentElement.outerHTML,'text/html;charset=utf-8');notify(t('Файл готов. Загрузите его на хостинг по инструкции.','Файл дайын. Нұсқаулық бойынша хостингке жүктеңіз.'));}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id;try{
 if(a==='menu')$('#sidebar').classList.toggle('open');else if(a==='close-menu')$('#sidebar').classList.remove('open');else if(a==='lang'){state.language=el.dataset.value;save();render();}
 else if(a==='close')closeModal();else if(a==='new-lesson')lessonForm();else if(a==='edit-lesson')lessonForm(id);else if(a==='lesson')lessonDetails(id);
 else if(a==='favorite'){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();render();}
 else if(a==='mo')navigate('catalog?mo='+id);else if(a==='go-catalog')navigate('catalog');
 else if(a==='reset-filters'){filters={q:'',mo:'',subject:'',grade:'',month:'',language:'',status:''};history.replaceState(null,'','#'+route);render();}
 else if(a==='delete-lesson'){if(confirm(t('Удалить карточку из этой копии? Связанные записи плана останутся.','Карточканы осы көшірмеден жою керек пе? Жоспар жазбалары сақталады.'))){state.lessons=state.lessons.filter(l=>l.id!==id);state.favorites=state.favorites.filter(x=>x!==id);state.projects.forEach(p=>{if(p.lessonId===id)p.lessonId='';});save();closeModal();render();saved();}}
 else if(a==='print')window.print();else if(a==='lesson-txt'){const l=state.lessons.find(x=>x.id===id);download('lesson.txt',lessonText(l));}
 else if(a==='lesson-qr'){const l=state.lessons.find(x=>x.id===id);makeQR(l.url);closeModal();navigate('qr');}
 else if(a==='download-qr'){if(qrSVG)download('sfera-qr.svg',qrSVG,'image/svg+xml');}
 else if(a==='copy-qr')await copy(qrValue);
 else if(a==='save-qr'){const value=$('#qr-url').value.trim();if(!qrSVG||safeURL(value)!==qrValue)makeQR(value);const title=$('#qr-title').value.trim()||qrValue;if(state.qrLinks.some(q=>q.url===qrValue)){notify(t('Эта ссылка уже сохранена.','Бұл сілтеме сақталған.'));return;}if(state.qrLinks.length>=1000)throw Error(t('Достигнут предел: 1000 ссылок.','Шекке жетті: 1000 сілтеме.'));state.qrLinks.push({id:uid(),title,url:qrValue});save();render();saved();}
 else if(a==='open-qr'){const q=state.qrLinks.find(x=>x.id===id);makeQR(q.url);render();$('#qr-title').value=q.title;window.scrollTo(0,0);}
 else if(a==='delete-qr'){if(confirm(t('Удалить сохранённую ссылку?','Сақталған сілтемені жою керек пе?'))){state.qrLinks=state.qrLinks.filter(q=>q.id!==id);save();render();}}
 else if(a==='new-project')projectForm();else if(a==='edit-project')projectForm(id);else if(a==='plan-lesson')projectForm('',id);else if(a==='project-filter'){projectFilter=id;render();}
 else if(a==='delete-project'){if(confirm(t('Удалить запись плана и её результат?','Жоспар жазбасы мен нәтижесін жою керек пе?'))){state.projects=state.projects.filter(p=>p.id!==id);save();closeModal();render();}}
 else if(a==='copy-prompt')await copy($('#prompt-output').value);else if(a==='download-prompt'){const txt=$('#prompt-output').value;if(txt.trim())download('sfera-prompt.txt',txt);else notify(t('Сначала соберите запрос.','Алдымен сұрау құрастырыңыз.'));}
 else if(a==='backup')download('sfera-backup-'+day()+'.json',JSON.stringify(state,null,2),'application/json');else if(a==='import')$('#import-file').click();else if(a==='publish-export')publishExport();
 else if(a==='apply-seed'){if(confirm(t('Заменить каталог и название школы из нового файла? Сначала сохраните резервную копию: ваши изменения в карточках будут заменены. План и QR-банк сохранятся.','Каталог пен мектеп атауын жаңа файлдан ауыстыру керек пе? Алдымен сақтық көшірме жасаңыз: карточка өзгерістері ауыстырылады. Жоспар мен QR банкі сақталады.'))){state.lessons=clone(SEED.lessons);state.config=clone(SEED.config);state.revision=SEED.revision;state.favorites=state.favorites.filter(id=>state.lessons.some(l=>l.id===id));state.projects.forEach(p=>{if(!state.lessons.some(l=>l.id===p.lessonId))p.lessonId='';});save();render();saved();}}
 else if(a==='catalog-csv')download('sfera-catalog.csv',csv([[t('Тема','Тақырып'),t('Предметы','Пәндер'),'МО',t('Класс','Сынып'),t('Месяц','Ай'),t('Статус','Мәртебе'),t('Ссылка','Сілтеме')],...getFiltered(route==='favorites').map(l=>[l.title,l.subjects,tr(MO[l.mo]),l.grade||'',l.month?monthName(l.month):'',tr(STATUS[l.status]),l.url])]),'text/csv;charset=utf-8');
 else if(a==='analytics-csv')download('sfera-analytics.csv',csv([['МО',t('Всего','Барлығы'),t('Идеи','Идеялар'),t('Черновики','Жобалар'),t('Проверено','Тексерілген')],...Object.entries(MO).map(([id,n])=>{const ls=state.lessons.filter(l=>l.mo===id);return[tr(n),ls.length,ls.filter(l=>l.status==='idea').length,ls.filter(l=>l.status==='draft').length,ls.filter(l=>l.status==='ready').length];})]),'text/csv;charset=utf-8');
 }catch(error){notify(error.message||t('Не удалось выполнить действие.','Әрекет орындалмады.'));}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(!(f instanceof HTMLFormElement))return;const d=Object.fromEntries(new FormData(f));try{
 if(f.id==='global-search'){navigate('catalog?q='+encodeURIComponent((d.q||'').trim()));}
 else if(f.id==='filters'){filters={...filters,...d};render();}
 else if(f.id==='lesson-form'){
  if(!d.title.trim()||!d.subjects.trim())throw Error(t('Укажите тему и предметы.','Тақырып пен пәндерді енгізіңіз.'));
  if(d.status==='ready'&&(!Number(d.grade)||!d.goals.trim()||!d.content.trim()||!d.task.trim()))throw Error(t('Для проверенного урока заполните класс, цели, содержание и задание с оцениванием.','Тексерілген сабақ үшін сыныпты, мақсаттарды, мазмұнды және бағалау тапсырмасын толтырыңыз.'));
  const old=state.lessons.find(l=>l.id===editingId);if(!old&&state.lessons.length>=1500)throw Error(t('Достигнут предел: 1500 карточек.','Шекке жетті: 1500 карточка.'));
  const l={id:old?.id||uid(),title:d.title.trim(),subjects:d.subjects.trim(),mo:d.mo,grade:Number(d.grade),month:Number(d.month),language:d.language,status:d.status,goals:d.goals.trim(),content:d.content.trim(),task:d.task.trim(),profession:d.profession.trim(),url:safeURL(d.url.trim()),source:old?.source||'',updated:day()};
  if(old)state.lessons[state.lessons.indexOf(old)]=l;else state.lessons.unshift(l);save();closeModal();render();saved();
 }else if(f.id==='qr-form'){makeQR(d.url.trim());$('#qr-preview').innerHTML=qrSVG;$('#qr-actions').hidden=false;}
 else if(f.classList.contains('exercise-form')){const ex=EXERCISES.find(x=>x.id===f.dataset.id);const s=d.answer.trim().replace(',','.');if(!/^-?\d+(\.\d+)?$/.test(s))throw Error(t('Введите число; дробную часть можно отделить запятой.','Сан енгізіңіз; бөлшек бөлігін үтірмен бөлуге болады.'));const ok=Math.abs(Number(s)-ex.answer)<1e-8;$('#feedback-'+ex.id).className='feedback'+(ok?'':' error');$('#feedback-'+ex.id).textContent=(ok?t('Верно! ','Дұрыс! '):t('Пока не совпало. ','Әзірге сәйкес емес. '))+tr(ex.solution);}
 else if(f.id==='project-form'){const total=Number(d.total),achieved=Number(d.achieved);if(!Number.isInteger(total)||!Number.isInteger(achieved)||total<0||total>100000||achieved<0||achieved>total)throw Error(t('Число достигших критерия не может быть больше числа участников.','Критерийге жеткендер саны қатысушылар санынан артық бола алмайды.'));if(d.status==='done'&&total>0&&!d.criterion.trim())throw Error(t('Укажите критерий, по которому посчитан результат.','Нәтиже есептелген критерийді енгізіңіз.'));const old=state.projects.find(x=>x.id===editingId);if(!old&&state.projects.length>=1000)throw Error(t('Достигнут предел: 1000 записей.','Шекке жетті: 1000 жазба.'));const p={id:old?.id||uid(),title:d.title.trim(),lessonId:d.lessonId,date:d.date,status:d.status,notes:d.notes.trim(),criterion:d.criterion.trim(),total,achieved};if(!p.title)throw Error(t('Укажите название.','Атауын енгізіңіз.'));if(old)state.projects[state.projects.indexOf(old)]=p;else state.projects.push(p);save();closeModal();render();saved();}
 else if(f.id==='settings-form'){if(!d.school.trim()||!d.schoolKk.trim())throw Error(t('Заполните оба названия.','Екі атауды да толтырыңыз.'));state.config={school:d.school.trim(),schoolKk:d.schoolKk.trim()};save();render();saved();}
 else if(f.id==='prompt-form'){const kinds=['план интегрированного урока','контекстные задания','рабочий лист','идеи межпредметного проекта'];promptValue=`Ты помогаешь учителю школы Казахстана. Подготовь ${kinds[Number(d.kind)]}.\nЯзык результата: ${d.language}.\nТема: ${d.topic.trim()}.\nПредметы: ${d.subjects.trim()}.\nКласс: ${d.grade}. Продолжительность: ${d.minutes} минут.\n\nТочные цели обучения, предоставленные учителем:\n${d.goals.trim()}\n\nРесурсы и условия:\n${d.context.trim()||'Не указаны: предложи доступный вариант и обозначь допущения.'}\n\nТребования:\n1. Сохрани коды и формулировки целей; не придумывай официальные цели и нормативные требования. Если цели не подходят теме или классу, сначала укажи несоответствие.\n2. Покажи содержательную связь предметов, объяснение, действия учителя и учащихся, время этапов, ресурсы и критерии успеха.\n3. Дай задания с решениями и понятными критериями оценивания, поддержку для испытывающих трудности и усложнение.\n4. Предложи жизненный контекст и уместную связь с профессиями. Авторские задания не называй официальными заданиями PISA/TIMSS.\n5. Не запрашивай персональные данные учеников. Не утверждай, что материал проверен или официально утверждён.\n6. В конце перечисли, что учителю нужно проверить перед уроком. Если для полноценного материала не хватает данных, задай конкретные вопросы.`;$('#prompt-output').value=promptValue;notify(t('Запрос готов: скопируйте его в ИИ-чат.','Сұрау дайын: ЖИ чатына көшіріңіз.'));}
 }catch(error){notify(error.message||t('Проверьте введённые данные.','Енгізілген деректерді тексеріңіз.'));}});
document.addEventListener('change',e=>{if(e.target.closest('#filters')&&e.target.tagName==='SELECT'){$('#filters').requestSubmit();}});
document.addEventListener('input',e=>{if(e.target.id==='prompt-output')promptValue=e.target.value;});
$('#import-file').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>8000000)throw Error('size');const imported=validateState(JSON.parse(await f.text()));if(!confirm(t('Заменить текущие данные резервной копией? Несохранённые изменения будут потеряны.','Ағымдағы деректерді сақтық көшірмемен ауыстыру керек пе? Сақталмаған өзгерістер жоғалады.')))return;state=imported;save();render();saved();}catch(error){notify(t('Файл не принят. Нужна корректная JSON-копия «Сферы знаний» до 8 МБ. Текущие данные сохранены.','Файл қабылданбады. 8 МБ-тан аспайтын дұрыс JSON көшірмесі қажет. Ағымдағы деректер сақталды.'));}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
window.addEventListener('hashchange',readRoute);
window.addEventListener('storage',e=>{if(e.key===STORAGE)notify(t('Данные изменены в другой вкладке. Обновите страницу перед редактированием.','Деректер басқа қойындыда өзгерді. Өңдеу алдында бетті жаңартыңыз.'));});
readRoute();
</script></body></html>
